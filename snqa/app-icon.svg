<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 淺色柔和漸層背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <!-- SN 氣泡亮藍漸層 -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- QA 氣泡活力暖橘/珊瑚漸層 -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <!-- 柔和陰影 -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- 圓角外框與背景 (Squircle) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="106" fill="none" stroke="#bae6fd" stroke-width="4"/>
  
  <!-- 可愛背景裝飾星點 ✨ -->
  <circle cx="100" cy="120" r="10" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="420" cy="140" r="14" fill="#fde047" opacity="0.8"/>
  <circle cx="120" cy="400" r="12" fill="#fca5a5" opacity="0.6"/>
  <circle cx="410" cy="380" r="8" fill="#93c5fd" opacity="0.6"/>

  <!-- 主角：SN 圓潤氣泡框 -->
  <g filter="url(#dropShadow)">
    <rect x="76" y="110" width="280" height="200" rx="60" fill="url(#blueGrad)"/>
    <!-- 氣泡尾巴 -->
    <polygon points="120,305 150,340 180,305" fill="#2563eb"/>
    <!-- SN 可愛圓體字型 -->
    <text x="216" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Quicksand', 'Segoe UI', sans-serif" font-size="110" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SN</text>
  </g>

  <!-- 右下重疊：QA 活力小氣泡框 -->
  <g filter="url(#subtleShadow)">
    <rect x="236" y="250" width="200" height="150" rx="48" fill="url(#coralGrad)"/>
    <!-- 氣泡尾巴 -->
    <polygon points="390,395 370,425 340,395" fill="#f97316"/>
    <!-- QA 可愛圓體字型 -->
    <text x="336" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Quicksand', 'Segoe UI', sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">QA</text>
  </g>
</svg>
