<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3a0408">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="好運百搭">
<meta name="application-name" content="好運百搭">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>好運百搭v2</title>
<style>
:root{
  --cell: min(16.6vw, 88px);
  --gold:#f6d27a; --gold-hi:#fff3c4; --gold-lo:#b07a1c;
  --red:#7a0d12; --red-hi:#c8161f; --ink:#140205;
  --panel:#2a0509; --led:#ffcf4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--gold);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  background:
    radial-gradient(ellipse 120% 60% at 50% 0%, #6b0c14 0%, transparent 70%),
    repeating-linear-gradient(45deg, rgba(255,215,120,.035) 0 2px, transparent 2px 14px),
    #1a0205;
  display:flex;justify-content:center;
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
.serif{font-family:"Songti TC","Noto Serif TC","STSong","PMingLiU",serif}
.cab{width:min(100%,560px);padding:8px 8px 28px;position:relative}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.title{
  font-size:25px;font-weight:900;letter-spacing:6px;text-align:center;flex:1;
  background:linear-gradient(180deg,#fff7d6 0%,#f6d27a 45%,#c08422 60%,#ffe9a6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #4a0006) drop-shadow(0 0 10px rgba(255,190,80,.35));
}
.title small{display:block;font-size:10px;letter-spacing:4px;margin-top:-2px;opacity:.85}
.pill{
  border:1.5px solid var(--gold);padding:5px 12px !important;background:linear-gradient(#5a0a10,#2a0408);color:var(--gold);
  border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;min-width:58px;
  box-shadow:inset 0 1px 0 rgba(255,240,200,.25),0 2px 6px rgba(0,0,0,.5)
}
.pill:active{transform:translateY(1px)}

/* ---------- top screen ---------- */
.top{
  position:relative;border-radius:16px;padding:8px;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 78%, #ffcf6a 0%, #f08a1c 35%, #b8300d 65%, #6d0a0d 100%);
  border:3px solid transparent;
  background-clip:padding-box;
  box-shadow:0 0 0 2px #7a4a0c,0 0 0 4px var(--gold),0 8px 24px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.35);
}
.top::before{ /* lattice pattern */
  content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;
  background:
    repeating-linear-gradient(0deg, transparent 0 18px, #ffe6a0 18px 19px),
    repeating-linear-gradient(90deg, transparent 0 18px, #ffe6a0 18px 19px);
}
.meter{
  position:relative;display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,#3b0308,#160103);
  border:2px solid var(--gold);border-radius:10px;padding:4px 8px 4px 4px;
  box-shadow:inset 0 0 12px rgba(0,0,0,.8),0 2px 0 #6b3d05;
  transition:filter .3s,opacity .3s;
}
.meter .md{width:38px;height:38px;flex:none}
.meter .md svg{width:100%;height:100%}
.meter .lb{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--gold-hi);line-height:1.1;white-space:nowrap}
.meter .am{
  flex:1;text-align:right;font-weight:900;font-variant-numeric:tabular-nums;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(180deg,#fffbe8,#ffd66b 50%,#e09a20);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;
}
.meter .tag{
  position:absolute;top:-7px;left:46px;font-size:9px;font-weight:800;padding:1px 6px;border-radius:6px;
  background:#1f9d4c;color:#fff;border:1px solid #c9ffd9;letter-spacing:1px
}
.meter.off{filter:grayscale(.85) brightness(.6)}
.meter.off .tag{background:#555;border-color:#999}
.m-grand .am{font-size:23px}
.m-grand .md{width:36px;height:36px}
.m-grand .lb{font-size:15px}
.m-grand .tag{left:auto;right:10px}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:7px}
.mrow .meter{flex-direction:column;align-items:stretch;gap:0;padding:4px 5px 3px}
.mrow .meter .hd{display:flex;align-items:center;gap:4px}
.mrow .meter .md{width:26px;height:26px}
.mrow .meter .am{font-size:15px;text-align:center;margin-top:1px}
.mrow .meter .tag{left:auto;right:4px}
.ingot-stage{position:relative;height:80px;margin-top:4px;display:flex;justify-content:center;align-items:flex-end}
.ingot-stage .pilebase{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:230px;height:38px}
#ingotWrap{position:relative;width:136px;height:80px;z-index:2}
#ingot{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(80,20,0,.6)) drop-shadow(0 0 14px rgba(255,220,120,.55))}
#pile{position:absolute;left:50%;top:0;width:120px;height:40px;transform:translateX(-50%);pointer-events:none}
#pile i{position:absolute;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff6cf,#f6d27a 45%,#a8701a);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.ingot-hint{position:absolute;top:2px;right:6px;font-size:10px;color:#fff3c4;opacity:.85;text-shadow:0 1px 2px #000;z-index:3}

/* ---------- reels ---------- */
.fgban{
  display:none;margin:8px 0 0;padding:6px 10px;border-radius:10px;text-align:center;font-weight:900;
  background:linear-gradient(90deg,#3a0f6b,#7b2fc0,#3a0f6b);border:2px solid #e2c2ff;color:#fff;
  box-shadow:0 0 18px rgba(190,120,255,.6);letter-spacing:1px;font-size:14px
}
.fgban b{color:#ffe27a;font-variant-numeric:tabular-nums}
body.fgmode .fgban{display:block}
.frame{
  margin-top:8px;border-radius:14px;padding:6px 6px 4px;position:relative;
  background:linear-gradient(180deg,#8f1218,#4a060b);
  box-shadow:0 0 0 2px #6b3d05,0 0 0 4px var(--gold),0 8px 20px rgba(0,0,0,.6);
  transition:box-shadow .4s,background .4s;
}
body.fgmode .frame{background:linear-gradient(180deg,#4b1680,#1d0636);box-shadow:0 0 0 2px #3c1366,0 0 0 4px #e2c2ff,0 0 26px rgba(180,110,255,.7)}
.frame-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:6px}
.logo{
  font-size:17px;font-weight:900;letter-spacing:2px;padding:2px 10px;border-radius:8px;
  background:linear-gradient(180deg,#ffe9a6,#d79a2b);color:#6d0a0d;border:1.5px solid #fff3c4;
  box-shadow:0 2px 0 #6b3d05;white-space:nowrap
}
.ways{font-size:11px;color:var(--gold-hi);opacity:.9;white-space:nowrap}
.markers{display:grid;grid-template-columns:repeat(5,var(--cell));gap:4px;justify-content:center;margin-bottom:3px}
.mk{height:20px;border-radius:6px 6px 2px 2px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
  letter-spacing:1px;color:#6a5a3a;background:#2b0a0d;border:1px solid #5a3a1a;transition:all .25s}
.mk.on{color:#5a0006;background:linear-gradient(180deg,#fff3c4,#f0b93a);border-color:#fff3c4;box-shadow:0 0 10px rgba(255,210,100,.8)}
.mk.none{background:none;border:none;color:#e9c97f;font-size:10px;letter-spacing:0;font-weight:700}
.reels{display:grid;grid-template-columns:repeat(5,var(--cell));gap:4px;justify-content:center}
.reel{height:calc(var(--cell)*3);overflow:hidden;position:relative;border-radius:8px;
  background:linear-gradient(180deg,#1b0205,#3a070c 50%,#1b0205);
  box-shadow:inset 0 6px 10px rgba(0,0,0,.8),inset 0 -6px 10px rgba(0,0,0,.8)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 18%,transparent 82%,rgba(0,0,0,.45))}
.reel.antic{box-shadow:0 0 0 2px #7fd3ff,0 0 18px #5ab8ff,inset 0 0 20px rgba(90,184,255,.6)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:var(--cell);width:100%;padding:3px;display:flex;align-items:center;justify-content:center;transition:opacity .25s}
.cell svg{width:100%;height:100%;display:block}
.reels.showing .cell{opacity:.32}
.reels.showing .cell.win{opacity:1;animation:pulse .9s ease-in-out infinite}
.cell.throw{animation:wildglow .5s ease-in-out 2}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}50%{transform:scale(1.07);filter:drop-shadow(0 0 8px #ffe27a)}}
@keyframes wildglow{50%{filter:drop-shadow(0 0 10px #fff3a0) brightness(1.3);transform:scale(1.08)}}
.enh{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:4px}
.enh .lb{font-size:11px;font-weight:800;color:var(--gold-hi);margin-right:2px;white-space:nowrap}
.enh .ic{width:27px;height:27px;position:relative;border-radius:6px;opacity:.35;filter:grayscale(.8);transition:all .3s}
.enh .ic svg{width:100%;height:100%}
.enh .ic.on{opacity:1;filter:none;box-shadow:0 0 8px rgba(255,220,120,.9)}
.enh .ic.on::after{content:"×3";position:absolute;right:-4px;bottom:-5px;font-size:9px;font-weight:900;background:#e0242c;color:#fff;border-radius:5px;padding:0 3px;border:1px solid #ffe9a6}


/* ---------- paytable panel ---------- */
.ptab{margin-top:7px;padding:6px;border-radius:12px;background:linear-gradient(180deg,#2e0509,#170204);border:1.5px solid #6b3d05}
.ptab .hd{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#e9c97f;margin:0 2px 4px;font-weight:700}
.ptab .hd b{color:#ffe27a}
.ptg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pi{display:grid;grid-template-columns:26px 1fr;gap:4px;align-items:center;padding:3px 4px;border-radius:8px;
  background:rgba(0,0,0,.35);border:1px solid #4a2a0a;transition:background .2s,border-color .2s,box-shadow .2s}
.pi .ic{width:26px;height:26px}
.pi .ic svg{width:100%;height:100%;display:block}
.pi .ls{font-size:clamp(8.5px,2.45vw,10.5px);line-height:1.28;font-variant-numeric:tabular-nums;color:#f3e2b8;white-space:nowrap;overflow:hidden}
.pi .ln{display:block;border-radius:3px;padding:0 2px}
.pi .ln i{font-style:normal;color:#b8955a;display:inline-block;width:9px;margin-right:2px}
.pi .ln.e{color:#7dff9a}
.pi .ic{position:relative}
.pi.boost .ic::after{content:"×3";position:absolute;right:-6px;top:-7px;font-size:6.5px;font-weight:900;background:#16a34a;color:#fff;border-radius:4px;padding:0 2px;border:1px solid #c9ffd9;line-height:1.3}
.pi .ln.note{color:#d8b46a;font-size:9px}
.pi.hit{border-color:#fff3c4;background:linear-gradient(180deg,#7a4a0c,#3a1a04);box-shadow:0 0 10px rgba(255,220,120,.85);animation:pihit .9s ease-in-out infinite}
.pi .ln.hit{background:linear-gradient(90deg,#fff0b8,#f0b93a);color:#5a0006;font-weight:900}
.pi .ln.hit i{color:#7a3d06}
@keyframes pihit{50%{transform:scale(1.04)}}

/* ---------- info ---------- */
.info{display:grid;grid-template-columns:1.25fr .85fr 1.1fr;gap:6px;margin-top:7px}
.led{background:#090102;border:1.5px solid #7a4a0c;border-radius:8px;padding:3px 6px 4px;text-align:center;box-shadow:inset 0 0 10px #000}
.led .k{font-size:10px;color:#d8b46a;letter-spacing:2px}
.led .v{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:17px;color:var(--led);
  text-shadow:0 0 8px rgba(255,190,40,.6);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led.win .v{color:#7dff9a;text-shadow:0 0 8px rgba(80,255,120,.6)}
.msg{height:20px;margin-top:4px;text-align:center;font-size:13px;font-weight:700;color:#fff3c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.bad{color:#ff8a8a}

/* ---------- controls ---------- */
.panel{margin-top:3px;padding:7px;border-radius:14px;background:linear-gradient(180deg,#2e0509,#170204);border:1.5px solid #6b3d05}
.brow{display:grid;gap:6px}
.brow.r1{grid-template-columns:repeat(4,1fr)}
.brow.r2{grid-template-columns:repeat(5,1fr);margin-top:5px}
.bb{
  border:1.5px solid #9a6a1c;border-radius:10px;padding:3px 2px 3px;cursor:pointer;text-align:center;line-height:1.1;
  background:linear-gradient(180deg,#6d0a10,#3a0408);color:#f3d38a;font-weight:800;
  box-shadow:inset 0 1px 0 rgba(255,230,180,.25),0 3px 0 #1a0204;transition:transform .08s
}
.bb .n{font-size:17px;font-family:"Arial Black",Arial,sans-serif}
.bb .s{font-size:9.5px;opacity:.85;margin-top:2px;white-space:nowrap}
.bb.sel{background:linear-gradient(180deg,#fff0b8,#f0b93a 60%,#c4801a);color:#5a0006;border-color:#fff3c4;box-shadow:0 0 12px rgba(255,200,80,.8),0 3px 0 #6b3d05}
.bb:active{transform:translateY(2px)}
.bb:disabled,.act:disabled{opacity:.4;cursor:not-allowed}
.arow{display:grid;grid-template-columns:1fr 1fr 82px;gap:8px;margin-top:8px;align-items:center}
.act{
  height:50px;border-radius:12px;border:1.5px solid var(--gold);cursor:pointer;font-weight:900;font-size:14px;line-height:1.15;
  color:#fff3c4;background:linear-gradient(180deg,#7b2fc0,#3a0f6b);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 #170528
}
.act small{display:block;font-size:10px;opacity:.85;font-weight:700}
.act.auto{background:linear-gradient(180deg,#1e6b3a,#0b3019)}
.act.auto.on{background:linear-gradient(180deg,#4dff8a,#16a34a);color:#06290f;box-shadow:0 0 14px rgba(80,255,140,.7)}
.spin{
  width:80px;height:80px;border-radius:50%;border:3px solid #fff3c4;cursor:pointer;justify-self:center;
  background:radial-gradient(circle at 40% 30%,#ff6b6b,#d0101a 45%,#6d0006 100%);
  color:#fff3c4;font-size:18px;font-weight:900;letter-spacing:2px;
  box-shadow:0 0 0 4px #b07a1c,0 6px 0 #3a0004,0 0 24px rgba(255,80,60,.55);
  text-shadow:0 2px 2px rgba(0,0,0,.6)
}
.spin:active{transform:translateY(3px);box-shadow:0 0 0 4px #b07a1c,0 3px 0 #3a0004}
.spin:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
.spin small{display:block;font-size:10px;letter-spacing:1px;opacity:.85}

/* ---------- footer ---------- */
.foot{margin-top:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:10.5px;color:#a8875a}
.stats{line-height:1.5}
.reset{
  position:relative;overflow:hidden;border:1px dashed #6a4a2a;background:transparent;color:#8a6a4a;border-radius:8px;
  font-size:10px;padding:6px 8px;cursor:pointer;white-space:nowrap;touch-action:none
}
.reset .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(224,36,44,.45);pointer-events:none}
.reset span{position:relative}

/* ---------- coins / fx ---------- */
.coin{position:fixed;width:22px;height:22px;border-radius:50%;z-index:60;pointer-events:none;
  background:radial-gradient(circle at 35% 35%,#fffbe0,#f6d27a 40%,#a8701a 100%);
  box-shadow:0 0 8px rgba(255,220,120,.9),0 2px 3px rgba(0,0,0,.5)}
.coin::after{content:"";position:absolute;left:8px;top:8px;width:6px;height:6px;background:#7a4a0c;border-radius:1px}
.rain{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.rain i{position:absolute;top:-30px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe0,#f6d27a 40%,#a8701a 100%);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}


/* ---------- 預告動畫 ---------- */
.omen{position:fixed;inset:0;z-index:85;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.omen.out{animation:fadeout .45s forwards}
.om-dim{position:absolute;inset:0;background:radial-gradient(circle,rgba(80,0,0,.74),rgba(0,0,0,.94));animation:fadein .35s}
.om-rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,215,100,.42) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0 12%,transparent 55%);mask:radial-gradient(circle,#000 0 12%,transparent 55%);
  animation:fadein .6s,rot 6s linear infinite}
.lv2 .om-rays{background:repeating-conic-gradient(from 0deg,rgba(255,90,60,.45) 0 5deg,rgba(255,215,100,.45) 5deg 10deg,transparent 10deg 18deg);animation:fadein .5s,rot 3.5s linear infinite}
.lv3 .om-rays{background:repeating-conic-gradient(from 0deg,rgba(255,80,80,.5) 0 4deg,rgba(255,220,90,.5) 4deg 8deg,rgba(120,255,160,.45) 8deg 12deg,rgba(110,180,255,.45) 12deg 16deg,rgba(200,120,255,.45) 16deg 20deg,transparent 20deg 24deg);animation:fadein .4s,rot 2.4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.om-flash{position:absolute;inset:0;background:#fffbe6;opacity:0;animation:omflash .55s ease-out}
.lv3 .om-flash{animation:omflash .55s ease-out,omflash .55s ease-out 1.2s}
@keyframes omflash{0%{opacity:.95}100%{opacity:0}}
.om-core{position:relative;text-align:center}
.om-medal{width:150px;height:150px;margin:0 auto;animation:medalIn .85s cubic-bezier(.2,1.6,.4,1) both,glowp 1s ease-in-out .85s infinite}
.om-medal svg{width:100%;height:100%;filter:drop-shadow(0 0 22px #ffd76a)}
.lv1 .om-medal{width:190px;height:120px}
@keyframes medalIn{from{transform:scale(0) rotate(-220deg);opacity:0}}
@keyframes glowp{50%{transform:scale(1.06);filter:brightness(1.3)}}
.om-sub{margin-top:6px;font-size:14px;font-weight:800;letter-spacing:6px;color:#fff3c4;opacity:0;animation:fadein .5s 1.3s forwards;text-shadow:0 0 10px #ff9d1c}
.om-txt{margin-top:12px;font-size:min(13vw,56px);font-weight:900;letter-spacing:4px;white-space:nowrap}
.om-txt span{display:inline-block;background:linear-gradient(180deg,#fff,#ffe27a 45%,#e08a14);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a0006) drop-shadow(0 0 14px rgba(255,200,80,.9));animation:dropin .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes dropin{from{transform:translateY(-140px) scale(2.6);opacity:0}}
.om-sp{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;background:radial-gradient(#fff,#ffd76a 55%,rgba(255,180,40,0) 70%)}
body.hot .frame{animation:hotglow .5s ease-in-out infinite alternate}
@keyframes hotglow{from{box-shadow:0 0 0 2px #6b3d05,0 0 0 4px #fff3c4,0 0 18px 4px rgba(255,210,90,.6)}to{box-shadow:0 0 0 2px #6b3d05,0 0 0 4px #fff3c4,0 0 38px 12px rgba(255,190,60,1)}}


/* ---------- 翻牌彩金 ---------- */
.pick .ov-box{width:min(100%,440px);padding:14px 12px 14px}
.pick h2{margin:2px 0 4px}
.pk-tip{font-size:12.5px!important;margin:2px 0 8px!important}
.pk-meters{display:flex;justify-content:center;gap:6px;margin:0 0 10px}
.pkm{flex:1;max-width:96px;background:rgba(0,0,0,.35);border:1px solid #6b3d05;border-radius:10px;padding:4px 2px;transition:all .25s}
.pkm .md{width:30px;height:30px;margin:0 auto}
.pkm .md svg{width:100%;height:100%}
.pkm .nm{font-size:11px;font-weight:800;color:#fff3c4;margin-top:1px}
.pkm .dots{display:flex;justify-content:center;gap:4px;margin-top:3px}
.pkm .dots i{width:10px;height:10px;border-radius:50%;background:#2a0f05;border:1px solid #8a6a3a;transition:all .2s}
.pkm .dots i.on{background:radial-gradient(circle at 35% 35%,#fffbe0,#ffd76a 50%,#c88a1c);box-shadow:0 0 6px #ffd76a;border-color:#fff3c4}
.pkm.near{border-color:#ffb347;animation:pihit .7s ease-in-out infinite}

<script>// ===== 好運百搭 遊戲引擎（數學模型） =====
(function (root) {
  // 符號：W 百搭, S 青花聚寶(免費遊戲), DR 金龍, SH 寶船, PT 錢袋, IG 元寶, BG 福袋, A K Q J T(10) N(9)
  // 賠率表（押注 88 時的贏分，其他押注等比例換算）— 依實體機台
  const PAY = {
    DR: [100, 200, 750], SH: [50, 100, 400], PT: [20, 30, 250], IG: [15, 20, 200], BG: [10, 15, 100],
    A: [5, 8, 10], K: [5, 8, 10], Q: [5, 8, 10], J: [5, 8, 10], T: [5, 8, 10], N: [5, 8, 10]
  };
  const PAY_SYMS = Object.keys(PAY);
  const SCAT_PAY = { 3: 5, 4: 10, 5: 50 };          // × 總押注
  const ENH_ORDER = ['BG', 'IG', 'PT', 'SH', 'DR']; // 同種類獎金增加 解鎖順序
  const BASE_BET = 88;

  // 下注選項
  const BETS = [
    { id: 'b33', bet: 33, label: '33', sub: '第5輪', active: [4], enh: 0, jp: ['mini'] },
    { id: 'b55', bet: 55, label: '55', sub: '第4-5輪', active: [3, 4], enh: 0, jp: ['mini', 'minor'] },
    { id: 'b66', bet: 66, label: '66', sub: '第3-5輪', active: [2, 3, 4], enh: 0, jp: ['mini', 'minor', 'major'] },
    { id: 'b88', bet: 88, label: '88', sub: '第2-5輪', active: [1, 2, 3, 4], enh: 0, jp: ['mini', 'minor', 'major', 'grand'] },
    { id: 'x2', bet: 176, label: '×2', sub: '176', active: [1, 2, 3, 4], enh: 1, jp: ['mini', 'minor', 'major', 'grand'] },
    { id: 'x3', bet: 264, label: '×3', sub: '264', active: [1, 2, 3, 4], enh: 2, jp: ['mini', 'minor', 'major', 'grand'] },
    { id: 'x5', bet: 440, label: '×5', sub: '440', active: [1, 2, 3, 4], enh: 3, jp: ['mini', 'minor', 'major', 'grand'] },
    { id: 'x8', bet: 704, label: '×8', sub: '704', active: [1, 2, 3, 4], enh: 4, jp: ['mini', 'minor', 'major', 'grand'] },
    { id: 'x10', bet: 880, label: '×10', sub: '880', active: [1, 2, 3, 4], enh: 5, jp: ['mini', 'minor', 'major', 'grand'] }
  ];
  // 倍數押注：套用在所選的基本押注上（例：33 ×2 = 66）；有效輪與彩金資格看基本押注，加碼看倍數
  const MULTS = [1, 2, 3, 5, 8, 10];
  const MULT_ENH = { 1: 0, 2: 1, 3: 2, 5: 3, 8: 4, 10: 5 };
  function makeBet(baseId, m) {
    const base = BETS.find(b => b.id === baseId && !b.enh) || BETS.find(b => b.id === 'b88');
    if (!(m in MULT_ENH)) m = 1;
    return { id: base.id + 'x' + m, base: base.id, m, bet: base.bet * m, label: m > 1 ? `${base.bet}×${m}` : `${base.bet}`,
      sub: base.sub, active: base.active, enh: MULT_ENH[m], jp: base.jp };
  }
  const BUY_PRICE = 5000; // 以 88 押注計算的免費遊戲

  // 平衡用：免費遊戲轉輪每輪移除的數字/字母符號數量，讓各選項期望值接近
  const TRIM = (root.__TRIM || [-2, -1, -5, -1, 1]);
  const FG_OPTIONS = [
    { spins: 3, wilds: 88, trim: TRIM[0] }, { spins: 5, wilds: 58, trim: TRIM[1] }, { spins: 10, wilds: 38, trim: TRIM[2] },
    { spins: 15, wilds: 18, trim: TRIM[3] }, { spins: 20, wilds: 8, trim: TRIM[4] }
  ];

  // 彩金
  const JP = {
    grand: { name: '巨獎', seed: 300000, inc: 0.0045, w: 0.002 },
    major: { name: '大獎', seed: 30000, inc: 0.003, w: 0.02 },

    mini: { name: '迷你獎', seed: 1000, inc: 0.001, w: 0.828 }
  };
  const P_THROW = 0.00245; // 每個有效百搭打落元寶的機率（88 押注），隨押注等比例提高

  // 轉輪組成（區塊：[符號, 疊放數量, 區塊數]）
  // 轉輪組成（區塊：[符號, 疊放高度, 區塊數]）— 大量疊放符號，增加 243 排列的組合數
  const REEL_DEF = root.__REELS || [
    [['DR', 1, 3], ['SH', 1, 3], ['PT', 1, 4], ['IG', 1, 5], ['BG', 1, 6], ['A', 1, 5], ['K', 1, 5], ['Q', 1, 6], ['J', 1, 6], ['T', 1, 6], ['N', 1, 6], ['S', 1, 4]],
    [['DR', 1, 3], ['SH', 1, 3], ['PT', 1, 4], ['IG', 1, 5], ['BG', 1, 6], ['A', 1, 6], ['K', 1, 5], ['Q', 1, 5], ['J', 1, 6], ['T', 1, 6], ['N', 1, 6], ['W', 1, 8], ['S', 1, 4]],
    [['DR', 1, 3], ['SH', 1, 3], ['PT', 1, 4], ['IG', 1, 5], ['BG', 1, 6], ['A', 1, 6], ['K', 1, 6], ['Q', 1, 5], ['J', 1, 5], ['T', 1, 6], ['N', 1, 6], ['W', 1, 8], ['S', 1, 4]],
    [['DR', 1, 3], ['SH', 1, 3], ['PT', 1, 4], ['IG', 1, 5], ['BG', 1, 6], ['A', 1, 6], ['K', 1, 6], ['Q', 1, 6], ['J', 1, 5], ['T', 1, 5], ['N', 1, 6], ['W', 1, 8], ['S', 1, 2]],
    [['DR', 1, 3], ['SH', 1, 3], ['PT', 1, 4], ['IG', 1, 5], ['BG', 1, 6], ['A', 1, 6], ['K', 1, 6], ['Q', 1, 6], ['J', 1, 6], ['T', 1, 5], ['N', 1, 5], ['W', 1, 8], ['S', 1, 2]]
  ];

function animateReels(grid, hot) {
  return new Promise(res => {
    const reels = [...reelsEl.children];
    const cell = reels[0].clientHeight / 3;
    const st = strips();
    let extra = hot ? 500 : 0, consec = 0, done = 0;
    reels.forEach((reel, r) => {
      const strip = reel.querySelector('.strip');
      const prev = [...strip.children].slice(0, 3).map(c => c.dataset.s);
      const antic = consec >= 2 && consec === r;   // 前面每一輪都連續出現青花聚寶
      if (antic) extra += 1000;
      if (consec === r && grid[r].includes('S')) consec++;
      const n = 14 + r * 5 + Math.round(extra / 55);
      const fill = []; for (let i = 0; i < n; i++) fill.push(st[r][Math.floor(rand() * st[r].length)]);
      strip.innerHTML = [...grid[r], ...fill, ...prev].map(cellHTML).join('');
      strip.style.transition = 'none';
      strip.style.transform = `translateY(${-(n + 3) * cell}px)`;
      void strip.offsetHeight;
      const dur = 620 + r * 230 + extra;
      if (antic) setTimeout(() => reel.classList.add('antic'), dur - extra);
      requestAnimationFrame(() => {
        strip.style.transition = `transform ${dur}ms cubic-bezier(.18,.6,.32,1)`;
        strip.style.transform = 'translateY(0)';
      });
      setTimeout(() => {
        reel.classList.remove('antic');
        strip.style.transition = 'none';
        strip.innerHTML = grid[r].map(cellHTML).join('');
        strip.style.transform = 'translateY(0)';
        strip.animate([{ transform: 'translateY(7px)' }, { transform: 'translateY(0)' }], { duration: 140, easing: 'ease-out' });
        SND.stop(); if (grid[r].includes('S')) SND.scat();
        if (++done === 5) setTimeout(res, 140);
      }, dur + 30);
    });
  });
}

async function doThrows(cells, jp) {
  if (!cells.length) return false;
  const ir = $('#ingotWrap').getBoundingClientRect();
  if (ir.top < 0) { window.scrollTo({ top: Math.max(0, window.scrollY + ir.top - 80), behavior: 'smooth' }); await sleep(380); }
  cells.forEach(([r, row]) => cellEl(r, row).classList.add('throw'));
  const last = jp ? jp.throwIndex : cells.length - 1;
  const flights = [];
  for (let i = 0; i <= last; i++) {
    const [r, row] = cells[i];
    flights.push(flyCoin(cellEl(r, row)));
    await sleep(230);
  }
  await Promise.all(flights);
  cells.forEach(([r, row]) => cellEl(r, row).classList.remove('throw'));
  if (jp) { await sleep(150); await knockIngot(); return true; }
  return false;
}

    text: `${NAME[w.sym]} ${w.len}連 × ${w.ways}組 = ${fmt(w.pay)}${w.enh ? '（5連加碼×3）' : ''}` }));
  if (ev.scatPay) items.push({ sym: 'S', len: ev.scatCount, cells: ev.scatCells, text: `青花聚寶 ×${ev.scatCount} = ${fmt(ev.scatPay)}` });
  reelsEl.classList.add('showing');
  lightWin(items);  // 先全部一起亮
  setMsg(items.length > 1 ? `共 ${items.length} 組中獎` : items[0].text);
  clearInterval(msgTimer);
  if (items.length > 1) {
    let li = -1;
    msgTimer = setInterval(() => {
      li = (li + 1) % (items.length + 1);
      if (li === items.length) { lightWin(items); setMsg(`共 ${items.length} 組中獎`); }
      else { lightWin([items[li]]); setMsg(items[li].text); }
    }, 1400);
  }
  const x = ev.total / cfg.bet;
  if (x >= 15) {
    SND.big(); coinRain(x >= 50 ? 70 : 40);
    const t = x >= 60 ? '巨 贏' : x >= 30 ? '超級大贏' : '大 贏';
    const bal0 = shownBalance;
    const p = overlay(`<div class="bigwin"><h2 class="serif">${t}</h2></div><div class="big" id="bwAmt">0</div><p>${(x).toFixed(1)} 倍押注</p>`,
      { btn: '', tapClose: true, auto: 3600 });
    const el = document.getElementById('bwAmt');
    await countUp(0, ev.total, 2400, v => { if (el) el.textContent = fmt(v); setWin(v); shownBalance = bal0 + v; $('#vBal').textContent = fmt(shownBalance); });
    await p;
  } else {
    SND.win();
    const bal0 = shownBalance;
    await countUp(0, ev.total, Math.min(1600, 450 + x * 120), v => { setWin(v); shownBalance = bal0 + v; $('#vBal').textContent = fmt(shownBalance); });
  }
  setWin(ev.total);
}

/* ================= 翻牌彩金 ================= */
const PK_BACK = `<svg viewBox="0 0 60 80"><defs><pattern id="pkp" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 5 L5 0 L10 5 L5 10Z" fill="none" stroke="rgba(255,215,120,.22)" stroke-width="1"/></pattern></defs>` +
  `<rect x="1" y="1" width="58" height="78" rx="8" fill="#9a0f18" stroke="url(#goldG)" stroke-width="2.5"/><rect x="1" y="1" width="58" height="78" rx="8" fill="url(#pkp)"/>` +
  `<rect x="6" y="6" width="48" height="68" rx="5" fill="none" stroke="rgba(255,230,160,.5)" stroke-width="1"/>` +
  `<circle cx="30" cy="40" r="15" fill="url(#goldG)" stroke="#6b3d05" stroke-width="1.5"/><circle cx="30" cy="40" r="11" fill="#b3161d"/>` +
  `<text x="30" y="45.5" text-anchor="middle" font-size="14" font-weight="900" fill="url(#goldG)" font-family="'Songti TC',serif">寶</text></svg>`;
// 產生翻牌順序：已決定的獎項(win)放 2 張，其他可贏的獎項各隨機 0～2 張（機率相同），洗牌後最後一張必為 win
function pickSequence(win, elig) {
  const seq = [win, win];
  elig.filter(k => k !== win).forEach(k => {
    const r = rand(), n = r < .1 ? 0 : r < .45 ? 1 : 2;
    for (let i = 0; i < n; i++) seq.push(k);
  });
  for (let i = seq.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [seq[i], seq[j]] = [seq[j], seq[i]]; }
  seq.push(win);
  return seq;
}
function pickGame(win, elig) {
  return new Promise(res => {
    const order = JPK.filter(k => elig.includes(k));
    const seq = pickSequence(win, order);
    const counts = {}; order.forEach(k => counts[k] = 0);
    let step = 0, done = false, autoT = null;
    const face = k => `<div class="md">${medal(k)}</div><div class="nm serif">${JPSTYLE[k].label}</div>`;
    const o = document.createElement('div'); o.className = 'ov pick';
    o.innerHTML = `<div class="ov-box"><h2 class="serif">翻牌贏彩金</h2>
      <p class="pk-tip">共 ${order.length * 3} 張，每種彩金各 3 張。先湊滿 <b style="color:#ffe27a">3 張相同</b> 就贏得該彩金</p>
      <div class="pk-meters">${order.map(k => `<div class="pkm" data-k="${k}"><div class="md">${medal(k)}</div><div class="nm serif">${JPSTYLE[k].label}</div><div class="dots"><i></i><i></i><i></i></div></div>`).join('')}</div>
      <div class="pk-grid" style="grid-template-columns:repeat(${order.length === 1 ? 3 : order.length === 2 ? 3 : order.length === 3 ? 3 : 4},1fr)">${Array.from({ length: order.length * 3 }, (_, i) => `<button class="pk" data-i="${i}"><div class="pk-in"><div class="pk-back">${PK_BACK}</div><div class="pk-front"></div></div></button>`).join('')}</div>
      <button class="btn2 grey pk-auto">自動翻牌</button></div>`;
    document.body.appendChild(o);
    const flip = btn => {
      if (done || !btn || btn.classList.contains('open')) return;
      const k = seq[step++]; counts[k]++;
      btn.dataset.k = k; btn.querySelector('.pk-front').innerHTML = face(k); btn.classList.add('open');
      const m = o.querySelector(`.pkm[data-k="${k}"]`);
      m.querySelectorAll('.dots i')[counts[k] - 1].classList.add('on');
      tone(620 + counts[k] * 180, .1, 'triangle', .07);
      if (counts[k] === 2 && step < seq.length) { m.classList.add('near'); tone(1320, .18, 'sine', .06, .08); }
      if (step === seq.length) {
        done = true; clearTimeout(autoT);
        o.querySelector('.pk-auto').disabled = true;
        o.querySelectorAll('.pkm').forEach(x => x.classList.remove('near'));
        m.classList.add('win');
        setTimeout(() => {
          o.querySelectorAll(`.pk.open[data-k="${k}"]`).forEach(b => b.classList.add('win'));
          SND.jp();
        }, 450);
        setTimeout(() => {   // 其餘蓋牌翻開：補滿每種彩金各 3 張
          const rest = [];
          order.forEach(t => { for (let i = counts[t]; i < 3; i++) rest.push(t); });
          for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
          o.querySelectorAll('.pk:not(.open)').forEach((b, i) => setTimeout(() => {
            b.querySelector('.pk-front').innerHTML = face(rest[i]);
            b.classList.add('open', 'rest');
          }, i * 70));
        }, 1100);
        setTimeout(() => { o.classList.add('out'); setTimeout(() => o.remove(), 240); res(); }, 3300);
      }
    };
    o.querySelectorAll('.pk').forEach(b => b.addEventListener('click', () => { if (!autoT) flip(b); }));
    o.querySelector('.pk-auto').addEventListener('click', e => {
      e.currentTarget.disabled = true;
      const go = () => {
        if (done) return;
        const c = [...o.querySelectorAll('.pk:not(.open)')];
        flip(c[Math.floor(rand() * c.length)]);
        if (!done) autoT = setTimeout(go, 600);
      };
      go();
    });
  });
}

/* 彌勒賜福：佛像從左邊慢慢滑進、經過畫面中央、再從右邊滑出（約 3.6 秒），全程閃閃發光 */
async function buddhaPass(o) {
  const mv = o.querySelector('.om-bdmove'), bob = o.querySelector('.om-bdbob');
  const w = mv.getBoundingClientRect().width || 300, half = innerWidth / 2 + w / 2 + 20;
  const DUR = 3600;
  mv.animate([
    { transform: `translateX(${-half}px)`, offset: 0 },
    { transform: `translateX(${-innerWidth * .1}px)`, offset: .3, easing: 'linear' },
    { transform: `translateX(${innerWidth * .1}px)`, offset: .7 },
    { transform: `translateX(${half}px)`, offset: 1 }
  ], { duration: DUR, easing: 'ease-in-out', fill: 'forwards' });
  // 一路灑下金色星光
  const stars = setInterval(() => {
    const r = bob.getBoundingClientRect();
    if (r.right < -40 || r.left > innerWidth + 40) return;
    for (let i = 0; i < 4; i++) {
      const st = document.createElement('i'); st.className = 'om-star' + (rand() < .3 ? ' w' : '');
      const x = r.left + r.width * (.15 + rand() * .7), y = r.top + r.height * (.1 + rand() * .8), sz = 8 + rand() * 18;
      st.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;height:${sz}px`;
      o.appendChild(st);
      st.animate([
        { transform: 'translate(-50%,-50%) scale(0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${-50 - 40 - rand() * 80}%, ${-50 + 60 + rand() * 120}%) scale(1) rotate(90deg)`, opacity: 1, offset: .35 },
        { transform: `translate(${-50 - 120 - rand() * 200}%, ${-50 + 200 + rand() * 300}%) scale(0) rotate(200deg)`, opacity: 0 }
      ], { duration: 900 + rand() * 700, easing: 'ease-out', fill: 'forwards' }).onfinish = () => st.remove();
    }
  }, 55);
  // 閃亮音效
  for (let i = 0; i < 22; i++) tone(1568 + (i % 5) * 196 + rand() * 120, .18, 'sine', .035, .3 + i * .15);
  await sleep(DUR);
  clearInterval(stars);
  await sleep(450);
}

}

/* ================= 主流程：旋轉 ================= */
async function spin() {
  if (busy) return;
  if (state.fgPending) { chooseFG(); return; }
  const inFG = !!state.fg;
  const cfg = curCfg();
  if (!inFG) {
    if (state.balance < cfg.bet) {
      stopAuto();
      if (state.balance < 33) gameOver(); else flash('積分不足，請降低押注');
      return;
    }
    state.balance -= cfg.bet; shownBalance -= cfg.bet;
    for (const k in E.JP) { const add = cfg.bet * E.JP[k].inc; state.jp[k] += add; contrib[k] += add; }
    state.stats.spins++; state.stats.wagered += cfg.bet;
    if (autoOn && autoRun) autoRun.left--;
  }
  busy = true; clearWinShow(); setWin(0); setMsg(''); renderAll();

  // 先決定結果並存檔（重新整理也不會改變結果）
  const { grid } = E.spinGrid(strips(), rand);
  const ev = E.evaluate(grid, cfg);
  const jp = E.rollJackpot(ev.throwCells.length, cfg, rand);
  let claimP = null;
  let retrig = false, triggered = false, fgSum = null;
  if (jp) {   // 共用彩金：向後端領取「當下」的金額（後端會同時重置）
    jpFrozen = { tier: jp.tier, amt: Math.round(state.jp[jp.tier] * 100) / 100 };
    state.stats.jps++;
    // 後端一確認就立刻入帳並存檔，翻牌途中重新整理也不會遺失彩金
    claimP = claimJackpot(jp.tier, jpFrozen.amt).then(amt => {
      const S = state.stats;
      state.balance += amt; S.won += amt; S.jpWon += amt; S.jpTier[jp.tier]++;
      S.biggest = Math.max(S.biggest, ev.total + amt);
      pushRecent('jp', amt, amt / cfg.bet, cfg.bet, jp.tier);
      if (fgSum) fgSum.total += amt; else if (state.fg) state.fg.total += amt;
      trackBal();
      const keep = state.fg; if (fgSum) state.fg = null; save(); if (fgSum) state.fg = keep;
      return amt;
    });
  }
  const credit = ev.total;
  if (!inFG) lastSpinWin = credit;
  state.balance += credit; state.stats.won += credit;
  state.stats.biggest = Math.max(state.stats.biggest, credit);
  if (inFG) {
    const f = state.fg;
    f.left--; f.played++; f.total += credit;
    if (ev.scatCount >= 3) { const add = E.FG_OPTIONS[f.opt].spins; f.left += add; f.spinsTotal += add; retrig = true; }
    if (f.left <= 0) { fgSum = { ...f }; }
  } else if (ev.scatCount >= 3) {
    state.fgPending = { betId: cfg.id }; state.stats.fg++; triggered = true;
  }
  { // 累積紀錄
    const S = state.stats, x = ev.total / cfg.bet;
    if (!inFG) {
      S.lineWon += ev.total - ev.scatPay; S.scatWon += ev.scatPay;
      if (ev.total > 0) S.hits++;
      S.sinceFG++; S.sinceJP++;
      if (credit > 0 || jp) S.loseStreak = 0; else { S.loseStreak++; S.maxLoseStreak = Math.max(S.maxLoseStreak, S.loseStreak); }
      if (x >= 15) { S.bigWins++; pushRecent('big', ev.total, x, cfg.bet); }
    } else { S.fgWon += ev.total; S.fgSpins++; }
    if (x >= OMEN_X) S.omens++;
    S.biggestX = Math.max(S.biggestX, x);
    if (jp) S.sinceJP = 0;
    if (triggered) { S.fgTrig++; S.sinceFG = 0; }
    if (fgSum) pushRecent('fg', fgSum.total, fgSum.total / cfg.bet, cfg.bet);
    if (!inFG || fgSum) trackBal();
  }
  state.grid = grid;
  const fgRef = state.fg;
  if (fgSum) state.fg = null;
  save();
  if (fgSum) state.fg = fgRef; // 動畫結束前畫面維持免費模式

  renderAll();
  const hot = ev.total >= OMEN_X * cfg.bet;
  if (hot) { await omen(ev.total / cfg.bet); document.body.classList.add('hot'); }
  await animateReels(grid, hot);
  document.body.classList.remove('hot');
  if (ev.throwCells.length) await doThrows(ev.throwCells, jp);
  if (ev.total > 0) await showWins(ev, cfg);
  if (jp) {
    await jackpotOverlay(jp.tier, claimP, cfg.jp);
    jpFrozen = null; renderMeters(); await restoreIngot(); stopAuto();
  }
  { const keep = state.fg; if (fgSum) state.fg = null; save(); if (fgSum) state.fg = keep; }
  shownBalance = state.balance; $('#vBal').textContent = fmt(shownBalance);

  if (inFG && retrig) {
    SND.fg();
    await overlay(`<h2 class="serif">再觸發！</h2><p>青花聚寶 ×${ev.scatCount}</p><div class="big">+${E.FG_OPTIONS[fgRef.opt].spins} 次</div>`, { btn: '', auto: 1800, tapClose: true });
  }
  if (fgSum) {
    state.fg = null; busy = false; renderAll();
    await endFG(fgSum);
  }
  if (triggered) {
    stopAuto(); SND.fg();
    await overlay(`<h2 class="serif">免費遊戲！</h2><div style="width:90px;height:90px;margin:6px auto">${SVG.S}</div><p>青花聚寶 ×${ev.scatCount}${ev.scatPay ? `，散佈獎 ${fmt(ev.scatPay)}` : ''}</p>`, { btn: '選擇免費遊戲' });
  }
  busy = false; renderAll();
  if (state.fgPending) { chooseFG(); return; }
  if (state.fg) { setTimeout(spin, 650); return; }
  if (autoOn) {
    const why = autoStopReason(inFG ? null : lastSpinWin);
    if (why) { stopAuto(); if (state.balance < 33) gameOver(); else flash('自動旋轉停止：' + why); return; }
    setTimeout(() => { if (autoOn && !busy) spin(); }, 500);
  }
}
let lastSpinWin = 0;
function autoStopReason(win) {
  if (!autoRun) return '';
  const net = state.balance - autoRun.startBal;
  if (win !== null && autoCfg.single > 0 && win >= autoCfg.single) return `單次贏分達 ${fmt(win)}`;
  if (autoCfg.profit > 0 && net >= autoCfg.profit) return `已賺 ${fmt(net)}`;
  if (autoCfg.loss > 0 && -net >= autoCfg.loss) return `已賠 ${fmt(-net)}`;
  if (autoRun.left <= 0) return '次數已到';
  if (state.balance < curCfg().bet) return '積分不足';
  return '';
}
function stopAuto() { autoOn = false; autoRun = null; renderAll(); }

function buyGrid() {
  const st = E.BASE_STRIPS, b88 = betCfg('b88x1');
  const win3 = (s, i) => [s[i % s.length], s[(i + 1) % s.length], s[(i + 2) % s.length]];
  let grid = null;
  for (let t = 0; t < 2000; t++) {
    grid = [];
    for (let r = 0; r < 5; r++) {
      const s = st[r]; let stop;
      if (r < 3) {
        const opts = [];
        for (let i = 0; i < s.length; i++) if (win3(s, i).filter(x => x === 'S').length === 1) opts.push(i);
        stop = opts[Math.floor(rand() * opts.length)];
      } else stop = Math.floor(rand() * s.length);
      grid.push(win3(s, stop));
    }
    // 購買那一轉只負責觸發：不出現百搭、不出現會被誤以為有中的連線
    if (!grid.some(c => c.includes('W')) && E.evaluate(grid, b88).wins.length === 0) return grid;
  }
  return grid;
}

  try {

let pollTimer = null;
function startGame(j) {
  // 伺服器與本機快取取較新的版本（避免同步途中重新整理而遺失最後幾轉）

  const useLocal = local && auth && local._tok === auth.token && typeof local.balance === 'number' && (local.rev || 0) > ((srv && srv.rev) || 0);
  if (local && !useLocal) { try { localStorage.removeItem(CACHE_KEY + j.account); } catch (e) { } }
  if (useLocal) delete local._tok;
  hydrate(useLocal ? local : srv);
  contrib = { grand: 0, major: 0, minor: 0, mini: 0 };

const newsQ = []; let newsShowing = false;
function handleNews(news, self) {
  if (!news) return;
  if (newsSince === null) { newsSince = news.last; return; }
  (news.items || []).forEach(it => { if (it.id > newsSince) newsQ.push(it); });
  newsSince = Math.max(newsSince, news.last || 0);
  showNextNews();
}
const TIER_OF = { '巨獎': 'grand', '大獎': 'major', '小獎': 'minor', '迷你獎': 'mini' };
async function showNextNews() {
  if (newsShowing || !newsQ.length) return;
  // 自己正在打元寶／翻牌時先不播，避免提前揭曉結果
  if (jpFrozen || document.querySelector('.pick')) { setTimeout(showNextNews, 1500); return; }
  newsShowing = true;
  const it = newsQ.shift(), tier = TIER_OF[it.name] || 'mini';
  const me = auth && it.account === auth.account;
  const bar = document.createElement('div'); bar.className = 'news ' + tier;
  bar.innerHTML = `<div class="news-in"><span class="nm">${medal(tier)}</span><span class="tx">🎉 恭喜 <b>${String(it.account).replace(/[<>&]/g, '')}</b>${me ? '（你）' : ''} 打中 <b class="tn">${it.name}</b> <b class="am">₱${fmt2(it.amount)}</b>！🎉</span></div>`;
  document.body.appendChild(bar);
  if (!me) { tone(1047, .15, 'triangle', .05); tone(1319, .2, 'triangle', .05, .12); if (tier === 'grand' || tier === 'major') SND.big(); }
  const tx = bar.querySelector('.news-in');
  const dist = bar.clientWidth + tx.scrollWidth;
  const dur = Math.max(6500, dist * 11) * (tier === 'grand' ? 1.4 : 1);
  await tx.animate([{ transform: `translateX(${bar.clientWidth}px)` }, { transform: `translateX(${-tx.scrollWidth}px)` }], { duration: dur, easing: 'linear' }).finished.catch(() => { });
  bar.classList.add('out'); await sleep(300); bar.remove();
  newsShowing = false; showNextNews();
}

renderAll();
fit();
requestAnimationFrame(fit);
setWin(0);
if (auth && API_URL) {
  showLogin('自動登入中…', true); $('#lgBtn').disabled = true;
  api('resume').then(j => startGame(Object.assign(j, { account: auth.account }))).catch(e => { if (e.message !== 'AUTH') showLogin('無法連線，請稍後再試或重新登入'); });
} else {
  let m = ''; try { m = sessionStorage.getItem('hb_msg') || ''; sessionStorage.removeItem('hb_msg'); } catch (e) { }
  showLogin(m);
}
})();
</script>
</body>
