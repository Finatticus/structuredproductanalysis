const QA_CSS = /^(color|background-color|background|font-size|font-weight|font-style|text-decoration|line-height|padding|border-radius|text-align)$/;
function qaStyle(st) {
  return String(st || '').split(';').map(x => {
    const i = x.indexOf(':'); if (i < 0) return '';
    const k = x.slice(0, i).trim().toLowerCase(), v = x.slice(i + 1).trim();
    if (!QA_CSS.test(k) || !/^[#a-z0-9.,%()\s-]+$/i.test(v) || /url|expression|javascript/i.test(v)) return '';
    return k + ':' + v;
  }).filter(Boolean).join(';');
}
function qaHref(h) {
  h = String(h || '').trim();
  if (/^(https?:|mailto:)/i.test(h)) return h;
  if (/^#\/[\w\-\/?=&%.]*$/.test(h)) return h;                    // 網站內的頁面，例如 #/tool/calc
  if (/^\\\\[^\\]/.test(h)) return 'file:' + h.replace(/\\/g, '/');   // 公司內部網路芳鄰路徑
  if (/^file:\/\//i.test(h)) return h;

}
function qaImgSrc(s) {
  s = String(s || '').trim();
  if (/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=\s]+$/i.test(s)) return s.replace(/\s/g, '');
  if (/^https?:\/\/[^\s"'<>]+$/i.test(s)) return s;

}
const qaImgs = raw => { const out = []; String(raw || '').replace(/\[IMG:(.*?)\]/g, (m, s) => { out.push(s); return m; }); return out; };
function qaSerialize(root) {
  let out = '';
  const escT = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/\u00a0/g, ' ');
  const img = el => { const src = el && el.getAttribute('src'); if (qaImgSrc(src)) out += '[IMG:' + src + ']'; };
  const walk = node => Array.from(node.childNodes).forEach(n => {
    if (n.nodeType === 3) { out += escT(n.nodeValue); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toUpperCase();
    if (tag === 'BR') { out += '\n'; return; }
    if (tag === 'IMG') { img(n); return; }
    if (n.classList.contains('qa-fig')) { img(n.querySelector('img')); return; }
    if (QA_DROP.test(tag)) return;
    if (tag === 'DIV' || tag === 'P') {   // 編輯時產生的段落 → 換行
      if (out && !out.endsWith('\n')) out += '\n';
      walk(n);
      if (!out.endsWith('\n')) out += '\n';
      return;
    }
    if (!QA_TAGS.has(tag)) { walk(n); return; }
    let attrs = '';
    const st = qaStyle(n.getAttribute('style'));
    if (st) attrs += ' style="' + st.replace(/"/g, '&quot;') + '"';
    if (tag === 'A') { const h = n.getAttribute('href'); if (h) attrs += ' href="' + h.replace(/"/g, '%22') + '"'; }
    if (tag === 'TD' || tag === 'TH') ['colspan', 'rowspan'].forEach(k => { const v = n.getAttribute(k); if (v && /^\d{1,2}$/.test(v)) attrs += ' ' + k + '="' + v + '"'; });
    if (tag === 'SPAN' && !attrs) { walk(n); return; }
    const t = tag.toLowerCase();
    out += '<' + t + attrs + '>';
    walk(n);
    if (tag !== 'HR') out += '</' + t + '>';

  return out.replace(/\s+$/, '');
}
function qaAnswerHTML(raw) {
  const imgs = [];
  let s = String(raw || '').replace(/\[IMG:(.*?)\]/g, (m, src) => { imgs.push(src); return '' + (imgs.length - 1) + ''; });
  s = s.replace(/\r\n?/g, '\n').replace(/\n/g, '<br>');
  const doc = new DOMParser().parseFromString('<body>' + s + '</body>', 'text/html');
  const walk = parent => Array.from(parent.childNodes).forEach(n => {
    if (n.nodeType === 3) return;
    if (n.nodeType !== 1) { n.remove(); return; }
    const tag = n.tagName.toUpperCase();
    if (QA_DROP.test(tag)) { n.remove(); return; }
    if (!QA_TAGS.has(tag)) { walk(n); n.replaceWith.apply(n, Array.from(n.childNodes)); return; }
    const keep = {};
    const st = qaStyle(n.getAttribute('style'));
    if (tag === 'FONT') { const c = n.getAttribute('color'); if (c && /^#?[a-z0-9]{3,20}$/i.test(c)) keep.style = 'color:' + c; }
    if (st) keep.style = (keep.style ? keep.style + ';' : '') + st;
    if (tag === 'A') {
      const h = qaHref(n.getAttribute('href'));
      const tm = h && h.match(/^#\/tool\/(\w+)/);
      if (tm && !toolOpen(tm[1])) { n.remove(); return; }   // 工具還沒開放：連結整個不顯示
      if (h && h.charAt(0) === '#') { keep.href = h; keep['data-close'] = ''; }

    Array.from(n.attributes).forEach(a => n.removeAttribute(a.name));

  }).replace(/(<br>\s*)+$/, '');
}

    const txt = t.nodeValue, low = txt.toLowerCase();
    let i = low.indexOf(query); if (i < 0) return;
    const frag = document.createDocumentFragment(); let last = 0;
    while (i >= 0) {
      frag.appendChild(document.createTextNode(txt.slice(last, i)));
      const m = document.createElement('mark'); m.textContent = txt.slice(i, i + query.length); frag.appendChild(m);
      last = i + query.length; i = low.indexOf(query, last);
    }
    frag.appendChild(document.createTextNode(txt.slice(last)));
    t.parentNode.replaceChild(frag, t);
  });
}
function qaRelatedHTML(q, nums) {
  const items = (q.relatedIds || []).map(qaById).filter(Boolean);
  if (!items.length) return '';
  nums = nums || qaNumbers();
  return '<div class="qa-rel"><div class="qa-rel-h">延伸閱讀</div>' + items.map(r =>
    '<button type="button" class="qa-rel-a" data-qa-open="' + esc(r.id) + '"><span class="qa-badge">' + esc(qaCatName(r.categoryId)) + ' #' + (nums[r.id] || '') + '</span><span>' + esc(r.question) + '</span></button>').join('') + '</div>';
}
function qaAnswerBlock(q, nums) {
  return '<div class="qa-answer">' + qaAnswerHTML(q.answer) + '</div>' + qaRelatedHTML(q, nums);
}
function copyText(text) {
  const done = () => toast('已複製連結', 'ok');
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(done, () => fallback());
  fallback();
  function fallback() {
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (e) { window.prompt('請複製這個連結：', text); }
    t.remove();
  }
}

/* ---- 單題閱讀視窗（QA 頁的視窗模式、商品頁共用） ---- */
function openQaViewer(ids, idx, opener, query) {
  const dlg = $('#faqModal');
  let list = ids.slice();
  const nums = qaNumbers();
  const show = i => {
    idx = i;
    const q = qaById(list[i]);
    if (!q) return;
    $('#faqNo').textContent = qaCatName(q.categoryId) + ' #' + (nums[q.id] || '');
    $('#faqTitle').textContent = q.question;
    $('#faqSub').hidden = true;
    const body = $('#faqBody');
    body.className = 'modal-body qa-scale';
    body.style.setProperty('--qa-scale', qaPrefs().fontSize / 100);
    body.innerHTML = qaAnswerBlock(q, nums);
    qaHighlight($('.qa-answer', body), query);
    body.scrollTop = 0;
    $('#faqMid').innerHTML = '<button type="button" class="nav" data-qa-copy="' + esc(q.id) + '">複製此題連結</button>' +
      (S.lastHash.indexOf('#/qa') === 0 ? '' : '<a class="nav" href="#/qa/' + encodeURIComponent(q.id) + '" data-close>在常見 QA 頁查看</a>') +
      (isAdmin() ? '<a class="nav" href="#/admin/qa/' + encodeURIComponent(q.id) + '" data-close>編輯</a>' : '');
    $('#faqPrev').disabled = i === 0;
    $('#faqNext').disabled = i === list.length - 1;
  };
  $('#faqPrev').onclick = () => { if (idx > 0) show(idx - 1); };
  $('#faqNext').onclick = () => { if (idx < list.length - 1) show(idx + 1); };
  dlg.onkeydown = e => { if (e.key === 'ArrowLeft' && idx > 0) show(idx - 1); if (e.key === 'ArrowRight' && idx < list.length - 1) show(idx + 1); };
  dlg.onclick = e => {
    const rel = e.target.closest('[data-qa-open]');
    if (rel) { const id = rel.dataset.qaOpen, j = list.indexOf(id); if (j >= 0) show(j); else { list = list.slice(0, idx + 1).concat([id]); show(idx + 1); } return; }
    const cp = e.target.closest('[data-qa-copy]'); if (cp) { copyText(qaLink(cp.dataset.qaCopy)); return; }
    const cl = e.target.closest('[data-close]');
    if (cl) {
      const h = cl.getAttribute('href');
      if (h && h.charAt(0) === '#') { e.preventDefault(); dlg.close(); setTimeout(() => { if (location.hash !== h) location.hash = h; else rerender(); }, 0); return; }
      dlg.close(); return;
    }
    if (e.target !== dlg) return;
    const r = dlg.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close();
  };
  dlg.onclose = () => { syncModalLock(); if (opener && document.contains(opener)) opener.focus(); };
  show(idx);
  if (!dlg.open) dlg.showModal();
  document.body.classList.add('modal-open');
}

/* ---- 圖片放大檢視（放大、縮小、滾輪、拖曳） ---- */
const LB = { z: 1, x: 0, y: 0, drag: null, moved: false };
function openLightbox(src) {
  const dlg = $('#lightbox'), img = $('#lbImg');
  img.src = src; LB.z = 1; LB.x = 0; LB.y = 0; lbApply();
  if (!dlg.open) dlg.showModal();
  document.body.classList.add('modal-open');
}
function lbApply(noAnim) {
  const img = $('#lbImg');
  img.style.transition = noAnim ? 'none' : 'transform .15s ease-out';
  img.style.transform = 'translate(' + LB.x + 'px,' + LB.y + 'px) scale(' + LB.z + ')';
  $('#lbZoom').textContent = Math.round(LB.z * 100) + '%';
}
function lbZoomBy(d) { LB.z = Math.max(0.2, Math.min(5, LB.z + d)); lbApply(); }
(function setupLightbox() {
  const dlg = $('#lightbox'), stage = $('#lbStage');
  dlg.addEventListener('click', e => {
    const b = e.target.closest('[data-lb]');
    if (b) { const a = b.dataset.lb; if (a === 'in') lbZoomBy(0.25); else if (a === 'out') lbZoomBy(-0.25); else if (a === 'reset') { LB.z = 1; LB.x = 0; LB.y = 0; lbApply(); } else if (a === 'close') dlg.close(); return; }
    if ((e.target === stage || e.target === dlg) && !LB.moved) dlg.close();
  });
  stage.addEventListener('wheel', e => { e.preventDefault(); lbZoomBy(e.deltaY < 0 ? 0.15 : -0.15); }, { passive: false });
  stage.addEventListener('pointerdown', e => { if (e.button !== 0) return; LB.drag = { sx: e.clientX - LB.x, sy: e.clientY - LB.y, ox: e.clientX, oy: e.clientY }; LB.moved = false; stage.classList.add('grab'); });
  window.addEventListener('pointermove', e => { if (!LB.drag) return; if (Math.abs(e.clientX - LB.drag.ox) + Math.abs(e.clientY - LB.drag.oy) > 4) LB.moved = true; LB.x = e.clientX - LB.drag.sx; LB.y = e.clientY - LB.drag.sy; lbApply(true); });
  window.addEventListener('pointerup', () => { if (LB.drag) { LB.drag = null; stage.classList.remove('grab'); setTimeout(() => { LB.moved = false; }, 0); } });
  dlg.addEventListener('close', syncModalLock);
  document.addEventListener('click', e => { const im = e.target.closest('img[data-zoom]'); if (im && !e.target.closest('#lightbox')) { e.preventDefault(); openLightbox(im.src); } });
})();

/* ---- QA 頁 ---- */
function viewQa(openId, catParam, keepOpen) {
  if (!keepOpen) QA.open.clear();
  // 從分類連結進來：切到該分類並清掉先前的搜尋字，避免看到「0 題」

    '<div class="crumbs"><a href="#/">首頁</a><span>/</span>常見 QA</div>' +

    '<div class="qa-mast-tools"><div class="search qa-search"><input id="qaSearch" type="search" placeholder="搜尋問題、關鍵字或解答內容…" autocomplete="off" value="' + esc(QA.q) + '"></div>' +
    '<div class="qa-mast-btns"><button type="button" class="btn sm light" data-qa-suggest>建議新增 QA</button><button type="button" class="btn sm light-ghost" data-qa-prefs>顯示設定</button>' +
    (isAdmin() ? '<a class="btn sm warn" href="#/admin/qa/new">＋ 新增問答</a><a class="btn sm light-ghost" href="#/admin/qa">管理 QA</a>' : '') + '</div></div></div></div></section>' +
    '<div class="qa-wrap"><nav class="filter qa-tabs" id="qaTabs" aria-label="QA 分類"></nav><div id="qaList" class="qa-list"></div></div></div>', 'qa');
  const root = $('#app .qa-page');
  const listEl = $('#qaList', root), tabsEl = $('#qaTabs', root);
  let nums = qaNumbers();

  function setHashFor(id) {
    const h = id ? '#/qa/' + encodeURIComponent(id) : '#/qa';

  }
  function renderTabs() {

      cats.map(c => '<button type="button" data-cat="' + esc(c.id) + '" class="' + (QA.cat === c.id ? 'on' : '') + '">' + esc(c.name) + '<sup>' + S.data.qaItems.filter(q => q.categoryId === c.id).length + '</sup></button>').join('');
  }
  function renderList() {
    const prefs = qaPrefs();
    listEl.style.setProperty('--qa-scale', prefs.fontSize / 100);
    listEl.classList.toggle('compact', prefs.displayMode === 'modal');
    const query = QA.q.trim().toLowerCase();
    const items = qaSorted().filter(q => (QA.cat === 'all' || q.categoryId === QA.cat) && (!query || qaPlain(q).indexOf(query) >= 0));
    if (!total) {
      listEl.innerHTML = '<div class="qa-empty"><h3>目前還沒有任何 QA</h3>' + (isAdmin() ? '<p>可以到「備份與匯入」從舊版 SNQA 搬移題目，或直接新增。</p><p><a class="btn" href="#/admin/backup">前往搬移舊版 SNQA</a> <a class="btn ghost" href="#/admin/qa/new">＋ 新增問答</a></p>' : '<p>內容建置中。</p>') + '</div>';
      return;
    }
    if (!items.length) {
      listEl.innerHTML = '<div class="qa-empty"><h3>找不到符合的問題</h3><p>試試其他關鍵字，或把問題送給管理員補充。</p><p><button type="button" class="btn" data-qa-suggest>建議新增這個問題</button></p></div>';
      return;
    }

      lastCat = q.categoryId;

      const adminBtns = isAdmin() ? '<div class="qa-admin"><a class="btn sm ghost" href="#/admin/qa/' + encodeURIComponent(q.id) + '">編輯</a><button type="button" class="icon-btn" title="上移" data-qa-move="-1" data-id="' + esc(q.id) + '">↑</button><button type="button" class="icon-btn" title="下移" data-qa-move="1" data-id="' + esc(q.id) + '">↓</button><button type="button" class="icon-btn del" title="刪除" data-qa-del="' + esc(q.id) + '">✕</button></div>' : '';
      return head + '<article class="qa-card' + (open ? ' open' : '') + '" id="qa-' + esc(q.id) + '" data-id="' + esc(q.id) + '">' +
        '<button type="button" class="qa-q" data-qa-toggle="' + esc(q.id) + '" aria-expanded="' + open + '"><span class="qa-badge">' + esc(qaCatName(q.categoryId)) + ' #' + nums[q.id] + '</span>' +
        '<span class="qa-qt">' + esc(q.question) + '</span><span class="qa-tog" aria-hidden="true">' + (compact ? '閱讀' : '') + '</span></button>' +
        (compact ? adminBtns : '<div class="qa-a"' + (open ? '' : ' hidden') + '>' + (open ? qaAnswerBlock(q, nums) : '') +

        '</article>';
    }).join('');
    if (query) $$('.qa-qt, .qa-card.open .qa-answer', listEl).forEach(el => qaHighlight(el, query));
  }
  function toggle(id, force) {
    const card = $('#qa-' + CSS.escape(id), listEl);
    if (!card) return;
    if (listEl.classList.contains('compact')) {
      const ids = $$('.qa-card', listEl).map(c => c.dataset.id);
      setHashFor(id);
      openQaViewer(ids, Math.max(0, ids.indexOf(id)), $('.qa-q', card), QA.q);
      $('#faqModal').addEventListener('close', () => { if (S.lastHash.indexOf('#/qa') === 0 && location.hash.indexOf('#/qa') === 0) setHashFor(null); }, { once: true });
      return;
    }
    const open = force != null ? force : !card.classList.contains('open');
    const a = $('.qa-a', card);
    if (open && !$('.qa-answer', a)) { a.insertAdjacentHTML('afterbegin', qaAnswerBlock(qaById(id), nums)); qaHighlight($('.qa-answer', a), QA.q); }
    card.classList.toggle('open', open); a.hidden = !open;
    $('.qa-q', card).setAttribute('aria-expanded', String(open));
    if (open) { QA.open.add(id); setHashFor(id); } else { QA.open.delete(id); if (location.hash === '#/qa/' + encodeURIComponent(id)) setHashFor(null); }
  }
  function focusItem(id) {
    const q = qaById(id);
    if (!q) { toast('找不到這一題，可能已被刪除', 'err'); setHashFor(null); return; }
    let changed = false;
    if (QA.cat !== 'all' && QA.cat !== q.categoryId) { QA.cat = 'all'; changed = true; }
    if (QA.q && qaPlain(q).indexOf(QA.q.trim().toLowerCase()) < 0) { QA.q = ''; $('#qaSearch', root).value = ''; changed = true; }
    if (changed) { renderTabs(); renderList(); }
    const card = $('#qa-' + CSS.escape(id), listEl);
    if (!card) return;
    if (listEl.classList.contains('compact')) { toggle(id); return; }
    toggle(id, true);
    const y = card.getBoundingClientRect().top + window.scrollY - Math.max(120, (window.innerHeight - Math.min(card.offsetHeight, window.innerHeight * 0.6)) / 2);
    window.scrollTo(0, Math.max(0, y));
    card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1800);
  }

  renderTabs(); renderList();
  let tmr = null;
  $('#qaSearch', root).addEventListener('input', e => { clearTimeout(tmr); tmr = setTimeout(() => { QA.q = e.target.value; renderList(); }, 120); });
  root.addEventListener('click', async e => {
    const t = e.target;
    const lk = t.closest('.qa-answer a[href^="#/"]');
    if (lk && !e.ctrlKey && !e.metaKey && !e.shiftKey) { e.preventDefault(); const h = lk.getAttribute('href'); if (location.hash !== h) location.hash = h; return; }
    const tab = t.closest('#qaTabs [data-cat]'); if (tab) { QA.cat = tab.dataset.cat; renderTabs(); renderList(); return; }
    const tg = t.closest('[data-qa-toggle]'); if (tg) { toggle(tg.dataset.qaToggle); return; }
    const rel = t.closest('[data-qa-open]'); if (rel) { focusItem(rel.dataset.qaOpen); return; }
    const cp = t.closest('[data-qa-copy]'); if (cp) { copyText(qaLink(cp.dataset.qaCopy)); return; }
    if (t.closest('[data-qa-suggest]')) { openSuggest(QA.q.trim()); return; }
    if (t.closest('[data-qa-prefs]')) { openQaPrefs(() => { nums = qaNumbers(); renderList(); }); return; }
    const mv = t.closest('[data-qa-move]');
    if (mv) { try { busy(true, '調整排序…'); await qaMove(mv.dataset.id, +mv.dataset.qaMove); busy(false); nums = qaNumbers(); renderList(); } catch (err) { busy(false); errToast(err); } return; }
    const del = t.closest('[data-qa-del]');
    if (del) { if (await qaDelete(del.dataset.qaDel)) { nums = qaNumbers(); renderTabs(); renderList(); } }
  });
  if (openId) setTimeout(() => focusItem(openId), 30);
}

/* ---- 管理員：排序、刪除 ---- */
async function qaMove(id, dir) {
  const q = qaById(id); if (!q) return;
  const ids = qaSorted().filter(x => x.categoryId === q.categoryId).map(x => x.id);
  const i = ids.indexOf(id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  await reorder('qaItems', ids);
}
async function qaDelete(id) {
  const q = qaById(id); if (!q) return false;
  const used = qaUsage(id).length, refs = S.data.qaItems.filter(x => (x.relatedIds || []).indexOf(id) >= 0).length;
  const extra = (used ? '<br>會同時從 ' + used + ' 個商品頁移除' : '') + (refs ? '<br>並從 ' + refs + ' 題的延伸閱讀移除' : '');
  if (!(await confirmBox('刪除問答', '確定刪除「' + esc(q.question) + '」？' + extra + '<br>可在版本紀錄還原。', '刪除', true))) return false;
  try { busy(true, '刪除中…'); await removeItem('qaItems', id); busy(false); QA.open.delete(id); toast('已刪除', 'ok'); return true; }
  catch (e) { busy(false); errToast(e); return false; }
}

/* ---- 管理後台：常見 QA ---- */
function adminQa() {
  const cats = qaCatsSorted(), nums = qaNumbers(), all = qaSorted();
  const catRows = cats.map((c, i) => {
    const n = all.filter(q => q.categoryId === c.id).length;
    return '<tr><td><div class="ctl"><button class="icon-btn" title="上移" data-qc-move="-1" data-id="' + esc(c.id) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button><button class="icon-btn" title="下移" data-qc-move="1" data-id="' + esc(c.id) + '"' + (i === cats.length - 1 ? ' disabled' : '') + '>↓</button></div></td>' +
      '<td class="nm">' + esc(c.name) + '</td><td>' + n + ' 題</td><td><div class="ctl" style="justify-content:flex-end"><a class="btn sm ghost" href="#/qa?c=' + encodeURIComponent(c.id) + '">檢視</a><button class="btn sm ghost" data-qc-edit="' + esc(c.id) + '">重新命名</button><button class="icon-btn del" title="刪除分類" data-qc-del="' + esc(c.id) + '">✕</button></div></td></tr>';
  }).join('');
  const orphan = all.filter(q => !cats.some(c => c.id === q.categoryId));

async function qaCompressImage(file) {
  const src = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('無法讀取圖片')); i.src = src; });
  let maxW = 1100, q = 0.82, out = '';
  for (let k = 0; k < 7; k++) {
    const w = Math.min(maxW, img.width), h = Math.round(img.height * (w / img.width));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
    out = cv.toDataURL('image/jpeg', q);
    if (out.length <= 150000) break;
    q = Math.max(0.45, q - 0.08); maxW = Math.round(maxW * 0.85);
  }
  return out;
}

    const a = e.target.closest('a[href]'); if (!a || !(e.ctrlKey || e.metaKey)) return;

  ed.addEventListener('mouseover', e => { const a = e.target.closest('a[href]'); if (a && !a.title) a.title = '編輯中：按住 Ctrl 再點擊可開啟連結'; });
  form.addEventListener('input', e => {
    if (e.target.id === 'qeRelQ') { const v = e.target.value.trim().toLowerCase(); $$('#qeRel label', form).forEach(l => { l.hidden = !!v && l.dataset.s.indexOf(v) < 0; }); return; }
    if (e.target === ed || /^(qeColor|qeMark|qeSize|qeFile)$/.test(e.target.id)) return;

  });
  form.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'qeColor' && t.value) { const v = t.value; t.value = ''; restore(); if (!lastRange || lastRange.collapsed) { toast('請先選取要套用的文字'); return; } document.execCommand('styleWithCSS', false, true); document.execCommand('foreColor', false, v); document.execCommand('styleWithCSS', false, false); changed(); return; }
    if (t.id === 'qeMark' && t.value) { const v = t.value; t.value = ''; wrapStyle('background-color:' + v + ';padding:0 3px;border-radius:3px'); return; }
    if (t.id === 'qeSize' && t.value) { const v = t.value; t.value = ''; wrapStyle('font-size:' + v); return; }
    if (t.id === 'qeFile') {
      const f = t.files[0]; t.value = ''; if (!f) return;
      try { busy(true, '壓縮圖片中…'); const url = await qaCompressImage(f); busy(false); insertImg(url); toast('圖片已加入（' + Math.round(url.length / 1024) + ' KB）', 'ok'); }
      catch (err) { busy(false); toast(err.message, 'err'); }
      return;
    }
    if (t.matches('#qeCat, #qeRel input')) changed();
    if (t.matches('#qeProd input')) markDirty(true);
  });
  // 工具列按鈕用 mousedown 擋掉預設動作，編輯區才不會失去選取範圍
  form.addEventListener('mousedown', e => { if (e.target.closest('button[data-qe]') && !srcMode) e.preventDefault(); });
  form.addEventListener('click', async e => {
    const b = e.target.closest('[data-qe]'); if (!b) return;
    const cmd = b.dataset.qe;
    if (cmd === 'max') { edMax(wrap); return; }
    if (cmd === 'src') { setSrc(!srcMode); return; }
    if (srcMode) { toast('請先按「回到編輯畫面」'); return; }
    restore();
    if (cmd === 'undo' || cmd === 'redo' || cmd === 'bold' || cmd === 'italic' || cmd === 'underline' || cmd === 'unlink') { document.execCommand(cmd); changed(); return; }
    if (cmd === 'clear') { document.execCommand('removeFormat'); changed(); return; }
    if (cmd === 'link') {
      const st = selText(), saved = lastRange && lastRange.cloneRange();
      const r = await pickLink(st, { allowPath: true });
      if (!r) return;
      lastRange = saved; restore();
      if (st) document.execCommand('createLink', false, r.href);
      else document.execCommand('insertHTML', false, '<a href="' + esc(r.href) + '">' + esc(r.text) + '</a>');
      changed(); return;
    }
    if (cmd === 'imgurl') {
      const saved = lastRange && lastRange.cloneRange();
      const u = window.prompt('請貼上圖片網址（https://…）：'); if (!u || !u.trim()) return;
      if (!qaImgSrc(u.trim())) { toast('圖片網址需以 http:// 或 https:// 開頭', 'err'); return; }
      lastRange = saved; insertImg(u.trim());
    }
  });
  async function save() {
    collect();
    const q = E.item;
    q.question = String(q.question || '').trim(); q.answer = String(q.answer || '').replace(/\s+$/, '');
    if (!S.data.qaCats.some(c => c.id === q.categoryId)) { toast('請選擇分類', 'err'); return; }
    if (!q.question) { toast('請填寫問題', 'err'); return; }
    if (!q.answer.trim()) { toast('請填寫解答', 'err'); return; }
    const out = clone(q);
    out.relatedIds = out.relatedIds.filter(x => qaById(x) && x !== out.id);
    if (E.isNew || out.categoryId !== origCat) { out.order = S.data.qaItems.filter(x => x.categoryId === out.categoryId && x.id !== out.id).length + 1; }
    busy(true, '儲存中…');
    try {
      const saved = await saveItem('qaItems', out, E.isNew ? undefined : E.base);
      // 問答本身已存檔：之後步驟若失敗再按儲存，要更新同一題而不是再新增一題
      E.isNew = false; E.item.id = saved.id; E.base = saved.updatedAt;
      // 延伸閱讀雙向：這一題勾了誰，對方也自動勾回來；取消時一併取消
      const relAdd = out.relatedIds.slice(), relDel = relBase.filter(x => out.relatedIds.indexOf(x) < 0);
      for (const oid of relAdd.concat(relDel)) {
        const o = qaById(oid); if (!o) continue;
        const ids = (o.relatedIds || []).slice(), has = ids.indexOf(saved.id) >= 0, add = relAdd.indexOf(oid) >= 0;
        if (add === has) continue;
        const c = clone(o); c.relatedIds = add ? ids.concat([saved.id]) : ids.filter(x => x !== saved.id);
        await saveItem('qaItems', c, o.updatedAt || '');
      }
      relBase.length = 0; out.relatedIds.forEach(x => relBase.push(x));
      const want = $$('#qeProd input:checked', form).map(x => x.value);
      for (const p of S.data.products.slice()) {
        const has = (p.qaIds || []).indexOf(saved.id) >= 0, should = want.indexOf(p.id) >= 0;
        if (has === should) continue;
        const c = clone(p); c.qaIds = should ? (c.qaIds || []).concat([saved.id]) : c.qaIds.filter(x => x !== saved.id); delete c.faqIds;
        await saveItem('products', c, p.updatedAt || '');
      }
      if (sug && S.data.qaSuggest.some(x => x.id === sug.id)) { try { await removeItem('qaSuggest', sug.id); } catch (e) { toast('問答已儲存，但移除待辦建議失敗：' + e.message, 'err'); } }
      busy(false); markDirty(false); toast('已儲存', 'ok');
      go('#/admin/qa/' + encodeURIComponent(saved.id), true);
    } catch (e) { busy(false); errToast(e); }
  }
  $('#saveBtn').addEventListener('click', save);
  const hb = $('#histBtn'); if (hb) hb.addEventListener('click', () => showHistory('qaItems', E.item.id, () => go('#/admin/qa/' + encodeURIComponent(E.item.id), true)));
  const db = $('#delBtn'); if (db) db.addEventListener('click', async () => { if (await qaDelete(E.item.id)) { markDirty(false); go('#/admin/qa'); } });
  loadEd(E.item.answer); preview(); markDirty(false);
}

const KIND = { categories: '類別', products: '商品', qaCats: 'QA分類', qaItems: 'QA問答', qaSuggest: '建議QA', faqs: '舊常見問題', pages: '內容頁', rfqs: '報價表', settings: '網站設定', images: '圖片' };
async function saveItem(type, item, base) {
  try {
    const r = await apiPost('save', { type: type, item: item, baseUpdatedAt: base === undefined ? null : base });
    upsertLocal(type, r.item);
    return r.item;
  } catch (e) {
    if (e.code !== 'CONFLICT') throw e;
    busy(false);
    const choice = await dialog({ title: '內容已被他人更新', size: 'narrow', body: '<p>' + esc(e.message) + '</p><p>要用你目前的內容覆蓋嗎？（對方的版本會保留在版本紀錄中，可以還原）</p>',
      actions: [{ label: '取消', value: null }, { label: '覆蓋儲存', value: true, cls: 'warn' }] });
    if (!choice) { const err = new Error('已取消儲存'); err.silent = true; throw err; }
    busy(true, '儲存中…');
    const r = await apiPost('save', { type: type, item: item, force: true });
    upsertLocal(type, r.item);
    return r.item;
  }
}
function upsertLocal(type, item) {
  const arr = S.data[type];
  const i = arr.findIndex(x => x.id === item.id);
  if (type === 'products') normalizeProduct(item);
  if (i >= 0) arr[i] = item; else arr.push(item);
  if (type !== 'qaSuggest') arr.sort((a, b) => (a.order || 0) - (b.order || 0));
  if (type === 'qaItems' && !Array.isArray(item.relatedIds)) item.relatedIds = [];
  S.data.empty = false;
}
async function removeItem(type, id) {
  await apiPost('delete', { type: type, id: id });
  S.data[type] = S.data[type].filter(x => x.id !== id);
  if (type === 'qaItems') {
    S.data.products.forEach(p => { p.qaIds = (p.qaIds || []).filter(x => x !== id); });
    S.data.qaItems.forEach(q => { q.relatedIds = (q.relatedIds || []).filter(x => x !== id); });
  }
}
async function reorder(type, ids) {
  await apiPost('reorder', { type: type, ids: ids });
  ids.forEach((id, i) => { const x = S.data[type].find(y => y.id === id); if (x) x.order = i + 1; });
  S.data[type].sort((a, b) => (a.order || 0) - (b.order || 0));
}
function errToast(e) { if (e && !e.silent && e.code !== 'AUTH') toast(e.message, 'err'); }
function fmtTime(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

/* 所見即所得文字編輯器
 * 工具列：粗體／斜體／底線、紅綠字、螢光、字級、（完整模式）小標／段落／清單／表格／重點框、連結、復原／重做、清除格式。
 * 復原／重做用自己的紀錄，因為標色、表格列等操作瀏覽器內建的復原記不到。 */
function rte(path, html, mode, ph) {
  mode = mode || 'mini';
  const btn = (cmd, label, title, cls) => '<button type="button" data-cmd="' + cmd + '" title="' + title + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + label + '</button>';

  const hist = g(btn('undo', '↶', '復原（Ctrl+Z）', 'ic') + btn('redo', '↷', '重做（Ctrl+Y）', 'ic'));
  const text = g(btn('bold', '<b>B</b>', '粗體（Ctrl+B）') + btn('italic', '<i>I</i>', '斜體（Ctrl+I）') + btn('underline', '<u>U</u>', '底線（Ctrl+U）'));
  const color = g(btn('neg', '<span style="color:#ad3434;font-weight:700">紅</span>', '紅字強調（先選取文字）') + btn('pos', '<span style="color:#23704a;font-weight:700">綠</span>', '綠字強調（先選取文字）') + btn('hl', '<span class="hl">螢光</span>', '螢光標記（先選取文字）'));
  const size = g(btn('fs-s', '<span style="font-size:12px">小字</span>', '縮小文字（先選取文字，再按一次取消）') + btn('fs-l', '<span style="font-size:15px">大字</span>', '放大文字（先選取文字，再按一次取消）') + btn('fs-xl', '<span style="font-size:17px">特大</span>', '特大文字（先選取文字，再按一次取消）'));
  const link = g(btn('link', '連結', '插入連結：常見 QA、商品架構或網址') + btn('unlink', '取消連結', '把游標放在連結上，取消連結'));
  const bar = mode === 'full'
    ? hist + sep + text + sep + color + sep + size + sep +
      g(btn('h4', '小標', '小標題') + btn('p', '內文', '一般段落') + btn('ul', '• 清單', '項目清單') + btn('ol', '1. 清單', '編號清單')) + sep +
      g(btn('table', '表格', '插入表格') + btn('rowAdd', '＋列', '在表格中新增一列') + btn('rowDel', '－列', '刪除表格目前這一列') + btn('callout', '重點框', '插入重點說明框')) + sep +
      link + sep + btn('clear', '清除格式', '清除選取文字的格式') + '<span class="sp"></span>' + btn('max', '⤢ 放大', '放大編輯（Esc 縮小）', 'max')
    : hist + sep + text + sep + color + sep + size + sep + link + sep + btn('clear', '清除', '清除格式') + '<span class="sp"></span>' + btn('max', '⤢ 放大', '放大編輯（Esc 縮小）', 'max');

}

/* 每個編輯框各自的復原紀錄 */
const RTE_HIST = new WeakMap();
function rteHist(body) {
  let h = RTE_HIST.get(body);
  if (!h) { h = { stack: [body.innerHTML], i: 0, t: null, mute: false }; RTE_HIST.set(body, h); }
  return h;
}
function rteSnap(body) {
  const h = rteHist(body); clearTimeout(h.t);
  const v = body.innerHTML;
  if (h.stack[h.i] === v) return;
  h.stack = h.stack.slice(0, h.i + 1); h.stack.push(v);
  if (h.stack.length > 150) h.stack.shift();
  h.i = h.stack.length - 1;
}
function rteStep(body, dir) {
  const h = rteHist(body); rteSnap(body);
  const j = h.i + dir;
  if (j < 0 || j >= h.stack.length) { toast(dir < 0 ? '已經沒有可以復原的步驟' : '已經沒有可以重做的步驟'); return; }
  h.i = j; h.mute = true;
  body.innerHTML = h.stack[j];
  body.dispatchEvent(new Event('input', { bubbles: true }));
  h.mute = false;
  const r = document.createRange(); r.selectNodeContents(body); r.collapse(false);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
function rteWrap(body, cls, group, sel, inBody, anchorEl) {
  const a = anchorEl(), ex = a && a.closest(group.map(c => 'span.' + c).join(','));
  if (ex && body.contains(ex) && (sel.isCollapsed || ex.classList.contains(cls))) { ex.replaceWith.apply(ex, Array.from(ex.childNodes)); return true; }
  if (!inBody || sel.isCollapsed) { toast('請先選取要套用的文字'); return false; }
  const r = sel.getRangeAt(0); const span = document.createElement('span'); span.className = cls;
  span.appendChild(r.extractContents()); r.insertNode(span);
  sel.removeAllRanges(); const nr = document.createRange(); nr.selectNodeContents(span); sel.addRange(nr);
  return true;
}
/* 放大編輯：把編輯框撐成畫面中央的大視窗，再按一次或 Esc 恢復 */
function edMax(box, force) {
  if (!box) return;
  const on = force === undefined ? !box.classList.contains('ed-max') : force;
  if (on) $$('.ed-max').forEach(x => { if (x !== box) edMax(x, false); });
  box.classList.toggle('ed-max', on);
  document.body.classList.toggle('ed-max-open', !!$('.ed-max'));
  const b = $('[data-cmd="max"], [data-qe="max"]', box);
  if (b) b.textContent = on ? '⤡ 縮小' : '⤢ 放大';
  const body = $('.rte-body, .qe-body:not([hidden]), .qa-src:not([hidden])', box);
  if (body && on) body.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = $('.ed-max'); if (m) { e.preventDefault(); edMax(m, false); } } });
window.addEventListener('hashchange', () => { $$('.ed-max').forEach(x => edMax(x, false)); document.body.classList.remove('ed-max-open'); });
async function rteCommand(body, cmd) {
  if (cmd === 'max') { edMax(body.closest('.rte')); return; }
  if (cmd === 'undo' || cmd === 'redo') { body.focus(); rteStep(body, cmd === 'undo' ? -1 : 1); return; }
  body.focus();
  const sel = window.getSelection();
  const inBody = sel.rangeCount > 0 && body.contains(sel.getRangeAt(0).commonAncestorContainer);
  const anchorEl = () => { if (!inBody) return null; const n = sel.anchorNode; return n && (n.nodeType === 1 ? n : n.parentElement); };
  rteSnap(body);
  switch (cmd) {
    case 'bold': case 'italic': case 'underline': document.execCommand(cmd); break;
    case 'neg': case 'pos': if (!rteWrap(body, cmd, ['neg', 'pos'], sel, inBody, anchorEl)) return; break;
    case 'hl': if (!rteWrap(body, 'hl', ['hl'], sel, inBody, anchorEl)) return; break;
    case 'fs-s': case 'fs-l': case 'fs-xl': if (!rteWrap(body, cmd, ['fs-s', 'fs-l', 'fs-xl'], sel, inBody, anchorEl)) return; break;
    case 'h4': document.execCommand('formatBlock', false, 'h4'); break;
    case 'p': document.execCommand('formatBlock', false, 'p'); break;
    case 'ul': document.execCommand('insertUnorderedList'); break;
    case 'ol': document.execCommand('insertOrderedList'); break;
    case 'table': document.execCommand('insertHTML', false, '<table><tbody><tr><th>項目</th><td>內容</td></tr><tr><th>項目</th><td>內容</td></tr></tbody></table><p><br></p>'); break;
    case 'rowAdd': case 'rowDel': {
      const a = anchorEl(), tr = a && a.closest('tr');
      if (!tr || !body.contains(tr)) { toast('請先把游標放在表格中'); return; }
      if (cmd === 'rowAdd') { const n = tr.cloneNode(true); Array.from(n.cells).forEach(c => { c.innerHTML = '<br>'; }); tr.after(n); }
      else if (tr.parentNode.rows.length > 1) tr.remove(); else tr.closest('table').remove();
      break;
    }
    case 'callout': document.execCommand('insertHTML', false, '<div class="callout"><h4>重點標題</h4>重點內容</div><p><br></p>'); break;
    case 'link': {
      const range = inBody ? sel.getRangeAt(0).cloneRange() : null;
      const chosen = await pickLink(range && !range.collapsed ? range.toString().trim() : '');
      if (!chosen) return;
      body.focus();
      const s2 = window.getSelection(); s2.removeAllRanges();
      if (range) s2.addRange(range); else { const r = document.createRange(); r.selectNodeContents(body); r.collapse(false); s2.addRange(r); }
      if (range && !range.collapsed) document.execCommand('createLink', false, chosen.href);
      else document.execCommand('insertHTML', false, '<a href="' + esc(chosen.href) + '">' + esc(chosen.text) + '</a>&nbsp;');
      break;
    }
    case 'unlink': {
      const a = anchorEl(), lk = a && a.closest('a');
      if (!lk || !body.contains(lk)) { toast('請先把游標放在要取消的連結上'); return; }
      lk.replaceWith.apply(lk, Array.from(lk.childNodes));
      break;
    }
    case 'clear': {
      document.execCommand('removeFormat');
      const a = anchorEl(); const ex = a && a.closest('span.neg, span.pos, span.hl, span.fs-s, span.fs-l, span.fs-xl');
      if (ex && body.contains(ex)) ex.replaceWith.apply(ex, Array.from(ex.childNodes));
      break;
    }
  }
  body.dispatchEvent(new Event('input', { bubbles: true }));
  rteSnap(body);
}

  const prodList = S.data.categories.map(c => { const l = S.data.products.filter(p => p.categoryId === c.id); return '<div class="pick-h">' + esc(c.name) + '</div><button type="button" data-href="#/c/' + esc(c.id) + '" data-text="' + esc(c.name) + '" data-s="' + esc(c.name.toLowerCase()) + '">整個類別：' + esc(c.name) + '</button>' + l.map(p => '<button type="button" data-href="#/p/' + esc(p.id) + '" data-text="' + esc(p.name) + '" data-s="' + esc((p.name + ' ' + (p.code || '')).toLowerCase()) + '">' + esc(p.name) + '<small>' + esc(p.code || '') + '</small></button>').join(''); }).join('') +
    ((S.data.rfqs || []).length ? '<div class="pick-h">報價表說明</div>' + S.data.rfqs.map(x => '<button type="button" data-href="#/rfq/' + esc(x.id) + '" data-text="' + esc(x.title) + '" data-s="' + esc(String(x.title || '').toLowerCase()) + '">' + esc(x.title) + '</button>').join('') : '');
  return dialog({
    title: '插入連結', size: 'narrow',
    body: '<div class="f"><span>連到哪裡</span><div class="seg" id="lkSeg" style="margin-top:4px"><button type="button" data-k="qa" class="on">常見 QA</button><button type="button" data-k="prod">商品・報價表</button><button type="button" data-k="url">網址</button></div></div>' +
      '<div data-pane="qa"><input class="inp" id="lkQ" placeholder="搜尋題目…"><div class="lk-list" id="lkQa">' + qaList + '</div><small class="muted" style="display:block;margin-top:6px">讀者點了會在原頁跳出這一題的視窗，不會離開目前的頁面。</small></div>' +

/**
 * 把表單容器綁到物件：輸入即寫回；結構操作（新增 / 刪除 / 移動）後呼叫 opts.rerender。
 * 新增項目用 data-add="陣列路徑" data-tpl="範本名稱"。
 */
function bindForm(root, getObj, opts) {
  const onChange = opts.onChange || (() => {});
  root.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset && t.dataset.bind && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
      let v = t.value;
      if (t.dataset.num) v = num(v);
      setPath(getObj(), t.dataset.bind, v);
      onChange(t.dataset.bind, false);
    } else if (t.dataset && t.dataset.rich) {
      setPath(getObj(), t.dataset.rich, t.innerHTML);
      onChange(t.dataset.rich, false);
      const h = rteHist(t);
      if (!h.mute) { clearTimeout(h.t); h.t = setTimeout(() => rteSnap(t), 450); }
    }
  });
  root.addEventListener('focusin', e => { const b = e.target.closest && e.target.closest('[data-rich]'); if (b) rteHist(b); });
  root.addEventListener('keydown', e => {
    const b = e.target.closest && e.target.closest('[data-rich]');
    if (!b || !(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); rteStep(b, -1); }
    else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); rteStep(b, 1); }
    else if (k === 'u') { e.preventDefault(); rteCommand(b, 'underline'); }
  });
  root.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.bind && (t.tagName === 'SELECT' || t.type === 'checkbox')) {
      let v = t.type === 'checkbox' ? t.checked : t.value;
      if (t.dataset.bool) v = v === 'true';
      setPath(getObj(), t.dataset.bind, v);
      onChange(t.dataset.bind, true);
    }
  });
  root.addEventListener('paste', e => {
    const body = e.target.closest && e.target.closest('[data-rich]');
    if (!body) return;
    e.preventDefault();
    rteSnap(body);
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
    rteSnap(body);
  });
  root.addEventListener('mousedown', e => {
    const b = e.target.closest('.rte-bar button');
    if (!b || !root.contains(b)) return;
    e.preventDefault();
    rteCommand(b.closest('.rte').querySelector('.rte-body'), b.dataset.cmd);
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-op],[data-add]');
    if (!b || !root.contains(b)) return;
    const obj = getObj();
    if (b.dataset.add) {
      const path = b.dataset.add;
      let arr = getPath(obj, path); if (!Array.isArray(arr)) { arr = []; setPath(obj, path, arr); }
      const tpl = opts.templates && opts.templates[b.dataset.tpl];
      arr.push(typeof tpl === 'function' ? tpl(obj, path) : clone(tpl == null ? '' : tpl));
      opts.rerender(path, 'add'); onChange(path, true); return;
    }
    const path = b.dataset.path, i = +b.dataset.i, arr = getPath(obj, path);
    if (!Array.isArray(arr)) return;
    if (b.dataset.op === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    else if (b.dataset.op === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    else if (b.dataset.op === 'del') arr.splice(i, 1);
    else return;
    opts.rerender(path, b.dataset.op); onChange(path, true);
  });
}

/* 圖片選擇 / 上傳 */
async function fileToBase64(file) {
  let blob = file;
  if (file.size > 1.5 * 1024 * 1024 && /^image\/(png|jpe?g|webp)$/.test(file.type) && window.createImageBitmap) {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
    blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.88));
  }
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { data: btoa(bin), mime: blob.type || file.type || 'image/png' };
}

        '<label class="f"><span>連結標的</span>' + inp('underlying', p.underlying, '例如：股票 / ETF') + '</label>' +
        '<label class="f"><span>保本</span><select class="sel" data-bind="protected" data-bool="1"><option value="false"' + (p.protected ? '' : ' selected') + '>不保本</option><option value="true"' + (p.protected ? ' selected' : '') + '>保本</option></select></label></div>' +
        '<div class="f"><span>首頁摘要</span>' + rte('summary', p.summary, 'mini', '顯示在首頁商品列表的一段說明') + '</div>' +
        '<div class="f"><span>頁首簡介</span>' + rte('intro', p.intro, 'mini', '商品頁最上方的介紹文字') + '</div>';
    }],
    ['features', '產品特色', '頁首右側的重點清單', () => listRows('features', P().features, '一句話特色') + '<button type="button" class="add-btn" data-add="features" data-tpl="text">＋ 新增特色</button>'],
    ['terms', '範例條件', '條款表（項目 / 內容）', () => kvRows('terms', P().terms, '項目，例如：履約價格 (Strike)', '內容，例如：期初價格 × 75%') + '<button type="button" class="add-btn" data-add="terms" data-tpl="kv">＋ 新增條件</button>'],
    ['mech', '機制說明與注意事項', '', () => '<div class="sub-h">機制說明</div>' + kvRows('mechanics', P().mechanics, '標題，例如：下限價 (Knock-In)', '說明') + '<button type="button" class="add-btn" data-add="mechanics" data-tpl="kv">＋ 新增機制說明</button>' +
      '<div class="sub-h">注意事項（紅框）</div>' + listRows('risks', P().risks, '注意事項', true) + '<button type="button" class="add-btn" data-add="risks" data-tpl="text">＋ 新增注意事項</button>'],
    ['scen', '情境分析', '走勢圖情境或圖片情境', () => {
      const m = P().scenarioMode || 'chart';
      return '<div class="add-row"><label class="chk"><input type="radio" name="smode" value="chart"' + (m === 'chart' ? ' checked' : '') + '> 走勢圖＋情境卡片</label><label class="chk"><input type="radio" name="smode" value="images"' + (m === 'images' ? ' checked' : '') + '> 圖片說明</label><label class="chk"><input type="radio" name="smode" value="none"' + (m === 'none' ? ' checked' : '') + '> 不顯示</label></div>' +

    form.innerHTML = SECTIONS.map(s => '<details class="box" data-sec="' + s[0] + '"' + (openState[s[0]] ? ' open' : '') + '><summary>' + s[1] + (s[2] ? ' <small>' + s[2] + '</small>' : '') + '</summary><div class="box-body">' + s[3]() + '</div></details>').join('');
    hydrateImages(form);
    if (keepScroll) window.scrollTo(0, y);

  let pt = null;
  function preview() {
    clearTimeout(pt);
    pt = setTimeout(() => {
      const pb = $('#edPrevBody'); if (!pb) return;
      const old = $('.chart-panel', pb); if (old && old._chart) old._chart.destroy();
      const sc = $('#edPrev').scrollTop;
      const p = normalizeProduct(clone(P()));

      pb.innerHTML = productHTML(p, { preview: true });
      mountProduct(pb, p);
      $('#edPrev').scrollTop = sc;
    }, 250);
  }
  S.cleanup.push(() => { clearTimeout(pt); const pb = $('#edPrevBody'); const old = pb && $('.chart-panel', pb); if (old && old._chart) old._chart.destroy(); });
  const reletter = () => P().scenarios.forEach((s, i) => { s.letter = String.fromCharCode(65 + i); });
  bindForm(form, P, {
    templates: Object.assign({ kv: { k: '', v: '' }, text: '', line: { label: '', value: 0, color: 'orange' }, figure: { title: '', text: '', imageId: '' }, scenario: () => scenarioTemplate(P()) }, COMMON_TPL),
    rerender: () => { reletter(); renderForm(true); },
    onChange: path => {
      markDirty(true); preview();
      if (/\.tone$/.test(path) || /^chart\.lines\.\d+\.stepped$/.test(path)) renderForm(true);

    if (t.dataset.lineMode != null) {
      const l = P().chart.lines[+t.dataset.lineMode], n = P().chart.labels.length;
      if (t.value === 'multi') { l.values = Array(n).fill(num(l.value)); delete l.value; }
      else { const v = (l.values || []).filter(x => x != null); l.value = v.length ? v[v.length - 1] : 0; delete l.values; delete l.stepped; }
      markDirty(true); renderForm(true); preview();
    }
  });
  form.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || !form.contains(b)) return;
    const p = P();
    if (b.dataset.col) {
      const c = p.chart;
      if (b.dataset.col === 'add') { c.labels.push(''); p.scenarios.forEach(s => { s.path.push(null); s.cashflows.push(''); }); c.lines.forEach(l => { if (Array.isArray(l.values)) l.values.push(null); }); }
      else if (c.labels.length > 2) { c.labels.pop(); const n = c.labels.length; p.scenarios.forEach(s => { s.path = s.path.slice(0, n); s.cashflows = s.cashflows.slice(0, n); }); c.lines.forEach(l => { if (Array.isArray(l.values)) l.values = l.values.slice(0, n); }); }

    }
    if (b.dataset.imgPick) { const iid = await pickImage(); if (iid) { setPath(p, b.dataset.imgPick, iid); markDirty(true); renderForm(true); preview(); } return; }
    if (b.dataset.imgClear) { setPath(p, b.dataset.imgClear, ''); markDirty(true); renderForm(true); preview(); return; }
    if (b.dataset.qaPick !== undefined) {
      const ids = await pickQa(p.qaIds);
      if (ids && ids.length) { ids.forEach(x => { if (p.qaIds.indexOf(x) < 0) p.qaIds.push(x); }); markDirty(true); renderForm(true); preview(); }
      return;
    }
  });

  async function save(publish) {
    const p = P();
    p.name = String(p.name || '').trim();
    if (!p.name) { toast('請填寫商品名稱', 'err'); openState.basic = true; renderForm(); window.scrollTo(0, 0); return; }
    if (!S.data.categories.some(c => c.id === p.categoryId)) { toast('請選擇商品類別', 'err'); return; }
    const out = clone(p);
    ['summary', 'intro'].forEach(k => { out[k] = sanitize(out[k]); });
    out.features = out.features.map(x => String(x || '').trim()).filter(Boolean);
    out.terms = out.terms.filter(t => String(t.k || '').trim() || plain(t.v)).map(t => ({ k: String(t.k || '').trim(), v: sanitize(t.v) }));
    out.mechanics = out.mechanics.filter(t => String(t.k || '').trim() || plain(t.v)).map(t => ({ k: String(t.k || '').trim(), v: sanitize(t.v) }));
    out.risks = out.risks.map(sanitize).filter(x => plain(x));
    out.scenarios.forEach(s => { s.condition = sanitize(s.condition); s.outcome = sanitize(s.outcome); s.path = (s.path || []).map(num); s.cashflows = (s.cashflows || []).map(x => String(x || '').trim()); });
    out.figures.forEach(f => { f.text = sanitize(f.text); });

    out.qaIds = (out.qaIds || []).filter(x => qaById(x));
    delete out.faqIds;

    busy(true, '儲存中…');
    try {
      const saved = await saveItem('products', out, E.isNew ? undefined : E.base);

      markDirty(false);
      toast(saved.status === 'draft' ? '已儲存，目前為隱藏（一般使用者看不到）' : '已儲存，一般使用者看得到', 'ok');

      E.item = normalizeProduct(clone(saved)); E.base = saved.updatedAt;
      $('#savePub').textContent = saved.status === 'draft' ? '儲存並顯示' : '儲存（顯示）';
      renderForm(true); preview();
    } catch (e) { busy(false); errToast(e); }
  }
  $('#saveDraft').addEventListener('click', () => save(false));
  $('#savePub').addEventListener('click', () => save(true));
  const hb = $('#histBtn'); if (hb) hb.addEventListener('click', () => showHistory('products', E.item.id, () => go('#/admin/product/' + encodeURIComponent(E.item.id), true)));
  renderForm(); preview(); markDirty(false);
}

      '<td><div class="ctl" style="justify-content:flex-end"><a class="btn sm ghost" href="#/page/' + encodeURIComponent(p.id) + '">檢視</a><a class="btn sm" href="#/admin/page/' + encodeURIComponent(p.id) + '">編輯</a><button class="icon-btn del" title="刪除" data-del-pg="' + esc(p.id) + '">✕</button></div></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty-note">尚無內容頁。</div>') + '</div>'), 'admin');
  $('#app').querySelector('.adm').addEventListener('click', async e => {

      if (b.dataset.delPg) { const p = ps.find(x => x.id === b.dataset.delPg); if (!(await confirmBox('刪除內容頁', '確定刪除「' + esc(p.title) + '」？可在版本紀錄還原。', '刪除', true))) return; busy(true); await removeItem('pages', p.id); busy(false); toast('已刪除', 'ok'); adminPages(); }
    } catch (err) { busy(false); errToast(err); }
  });
}

/* ---------- 報價表：匯入 Excel ---------- */
const rfqNormKey = s => String(s || '').toLowerCase().replace(/[\s()（）_\-.:：]/g, '');
function rfqSheetGrid(ws) {
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: true });
  return raw.slice(0, 300).map(r => Array.from(r.slice(0, 120), v => String(v == null ? '' : v).replace(/\s*[\r\n]+\s*/g, ' ').trim()));
}
function rfqDetectHead(grid) {
  const cnt = grid.map(r => r.filter(Boolean).length), max = Math.max(0, ...cnt);
  const need = Math.max(2, Math.ceil(max * 0.6));
  for (let i = 0; i < grid.length; i++) {
    const cells = grid[i].filter(Boolean);
    if (cells.length < need) continue;
    const text = cells.filter(v => !/^[-+]?[\d.,]+%?$/.test(v)).length;
    if (text / cells.length >= 0.6) return i;
  }
  return Math.max(0, cnt.findIndex(c => c > 0));
}
function rfqImport(cur) {
  let out = null;
  return dialog({
    title: '匯入 Excel 報價表', size: 'wide', sub: '讀取工作表的文字，帶入欄位名稱與範例列；帶入後仍可在表格上修改。',

      '<p class="muted" id="rqSum" style="font-size:13px;margin:8px 0 0"></p></div><p class="form-err"></p>',

          q('rqOpt').hidden = false; loadSheet();

      });
      q('rqSheet').addEventListener('change', loadSheet);
      q('rqHead').addEventListener('change', onHead);
      q('rqN').addEventListener('change', draw);
      el._build = () => {
        if (!wb) throw new Error('請先選擇 Excel 檔案');
        if (c1 < c0) throw new Error('選定的欄位名稱列是空的，請改選其他列');
        const h = +q('rqHead').value, N = +q('rqN').value;
        const keep = q('rqKeep').checked, std = q('rqStd').checked;

        if (std) RFQ_SAMPLE.columns.forEach(c => { sample[rfqNormKey(c.label)] = c; });
        const columns = grid[h].slice(c0, c1 + 1).map(label => {
          const k = rfqNormKey(label), m = (k && mine[k]) || (k && sample[k]);
          return m ? { label: label, name: m.name || '', values: m.values || '', desc: m.desc || '', merge: !!m.merge } : { label: label, name: '', values: '', desc: '', merge: false };
        });
        const rows = grid.slice(h + 1, h + 1 + N).map(r => { const x = r.slice(c0, c1 + 1); while (x.length < columns.length) x.push(''); return x; });
        return { columns: columns, rows: rows };
      };
    },
    onAction: (v, el) => { out = el._build(); }
  }).then(() => out);
}

/* 把從 Excel 複製的多格內容（Tab 分隔，含引號內換行）拆成二維陣列 */
function parseTsv(t) {
  t = String(t || '').replace(/\r\n?/g, '\n');
  if (t.endsWith('\n')) t = t.slice(0, -1);
  const rows = [[]]; let cell = '', i = 0, quoted = false;
  while (i < t.length) {
    const ch = t[i];
    if (quoted) {
      if (ch === '"' && t[i + 1] === '"') { cell += '"'; i += 2; continue; }
      if (ch === '"') { quoted = false; i++; continue; }
      cell += ch; i++; continue;
    }
    if (ch === '"' && cell === '') { quoted = true; i++; continue; }
    if (ch === '\t') { rows[rows.length - 1].push(cell); cell = ''; i++; continue; }
    if (ch === '\n') { rows[rows.length - 1].push(cell); rows.push([]); cell = ''; i++; continue; }
    cell += ch; i++;
  }
  rows[rows.length - 1].push(cell);
  return rows;
}

    if (act === 'addcol') { pushHist(); q.columns.push(blankCol()); q.rows.forEach(r => r.push('')); E.item = rfqNorm(q); changed(true); const ins = $$('.rfq-grid tr.hdr input', form); if (ins.length) ins[ins.length - 1].focus(); return; }

  }

  $('#savePub').addEventListener('click', () => save(true));

    const box = $('#lBody'); if (!box) return;
    box.innerHTML = items.length ? '<div class="table-scroll"><table class="atable"><thead><tr><th>時間</th><th>使用者</th><th>動作</th><th>對象</th><th>說明</th></tr></thead><tbody>' + items.map(l =>
      '<tr><td class="when">' + fmtTime(l.time) + '</td><td>' + esc(l.user) + '</td><td>' + esc(l.action) + '</td><td>' + esc(l.target) + '</td><td style="font-size:13px">' + esc(l.detail) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">尚無紀錄。</p>';
  } catch (e) { const box = $('#lBody'); if (box) box.innerHTML = '<p class="neg">' + esc(e.message) + '</p>'; }
}

/* ---------- 備份與匯入 ---------- */
function download(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function adminBackup() {
  render(adminShell('backup', '<div class="panel"><div class="panel-head"><h2>匯出備份</h2></div><div class="panel-body"><p>下載整個網站的內容（類別、商品、常見 QA、待辦 QA、內容頁、設定與圖片）成一個 JSON 備份檔。建議定期備份。</p><button class="btn" id="expBtn">下載備份檔</button></div></div>' +
    '<div class="panel"><div class="panel-head"><h2>匯入備份 / 初始資料</h2></div><div class="panel-body"><p>第一次使用時，請在這裡匯入 <b>GAS後端/初始資料.json</b>，現有的所有商品就會上傳到後端。也可以用來還原先前下載的備份。</p>' +
    '<div class="drop" style="margin:0 0 14px"><input type="file" id="impFile" accept=".json,application/json"></div><div id="impInfo"></div></div></div>' + snqaPanelHTML()), 'admin');
  bindSnqaPanel();
  $('#expBtn').addEventListener('click', async () => {
    try {
      busy(true, '匯出中（含圖片，可能需要數十秒）…');
      const r = await apiPost('export');
      const d = new Date();
      download('結構型商品網站備份_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json', JSON.stringify(r.data));
      busy(false); toast('備份檔已下載', 'ok');
    } catch (e) { busy(false); errToast(e); }
  });
  $('#impFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    const info = $('#impInfo');
    let data;
    try { data = JSON.parse(await f.text()); if (!data || data.format !== 'sn-site-backup') throw new Error('這不是本網站的備份檔'); }
    catch (err) { info.innerHTML = '<p class="neg">無法讀取：' + esc(err.message) + '</p>'; return; }
    const cnt = k => (data[k] || []).length;
    info.innerHTML = '<table class="atable" style="max-width:560px;margin-bottom:14px"><tr><th>檔案</th><td>' + esc(f.name) + '</td></tr><tr><th>建立時間</th><td>' + esc(fmtTime(data.exportedAt)) + (data.exportedBy ? '（' + esc(data.exportedBy) + '）' : '') + '</td></tr>' +
      '<tr><th>內容</th><td>類別 ' + cnt('categories') + '・商品 ' + cnt('products') + '・QA 分類 ' + cnt('qaCats') + '・QA ' + cnt('qaItems') + '・待辦 QA ' + cnt('qaSuggest') + '・內容頁 ' + cnt('pages') + '・圖片 ' + cnt('images') + '</td></tr></table>' +
      (data.qaItems ? '' : '<p class="muted" style="font-size:13px">這個備份檔沒有常見 QA 資料，匯入時會保留目前的常見 QA 不變。</p>') +
      '<div class="add-row" style="flex-direction:column;gap:8px"><label class="chk"><input type="radio" name="impMode" value="replace" checked> <b>全部取代</b>：以備份檔內容取代目前所有資料（目前內容會先存入版本紀錄）</label>' +
      '<label class="chk"><input type="radio" name="impMode" value="merge"> <b>合併</b>：只新增或更新備份檔中有的項目，其餘保留</label></div><button class="btn warn" id="impGo">開始匯入</button>';
    $('#impGo').addEventListener('click', async () => {
      const mode = ($('input[name=impMode]:checked') || {}).value || 'replace';
      if (!(await confirmBox('確認匯入', mode === 'replace' ? '將以備份檔<b>取代</b>目前所有內容，確定嗎？' : '將把備份檔內容合併到目前資料，確定嗎？', '匯入', mode === 'replace'))) return;
      try {
        busy(true, '匯入中（上傳圖片到雲端硬碟，約需 1 分鐘）…');
        const r = await apiPost('import', { data: data, mode: mode });
        S.imgCache.clear();
        await loadData(); busy(false);
        toast('匯入完成：商品 ' + (r.counts.products || 0) + ' 個、常見 QA ' + (r.counts.qaItems || 0) + ' 題', 'ok');
        go('#/admin');
      } catch (err) { busy(false); errToast(err); }
    });
  });
}

/* ---------- 發佈 HTML ---------- */
function adminPublish() {
  render(adminShell('publish', '<div class="panel"><div class="panel-head"><h2>發佈給同事使用</h2></div><div class="panel-body">' +
    '<p>網站只需要這一個 HTML 檔。下載「已內建後端網址」的版本發給同事，對方雙擊開啟就能看到最新內容，不需要任何設定。內容都存在後端，<b>之後修改商品不必重新發檔</b>。</p>' +
    '<label class="f"><span>後端網址</span><input class="inp" id="pubApi" value="' + esc(S.api) + '"></label>' +
    '<div class="actions"><button class="btn" id="pubDl">下載發佈版 HTML</button><button class="btn ghost" id="pubSave">只更新這台電腦的後端網址</button></div>' +
    '<p class="muted" style="font-size:13px;margin-top:16px">提醒：後端網址等同網站的入口，請只在內部流通。一般使用者只能讀取已上架的內容；新增、修改、刪除都必須以管理員帳號登入。</p></div></div>'), 'admin');
  $('#pubDl').addEventListener('click', () => {
    const url = $('#pubApi').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(url)) { toast('網址格式不正確，應以 https://script.google.com/ 開頭', 'err'); return; }
    const marker = new RegExp('const DEFAULT_' + 'API = "[^"]*";');
    if (!marker.test(SOURCE_HTML)) { toast('產生失敗：找不到網址設定行', 'err'); return; }
    const html = SOURCE_HTML.replace(marker, 'const DEFAULT_' + 'API = ' + JSON.stringify(url) + ';');
    download((S.data.settings.siteName || '境外結構型商品專區') + '.html', html, 'text/html');
    toast('已下載發佈版 HTML', 'ok');
  });
  $('#pubSave').addEventListener('click', () => {
    const url = $('#pubApi').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(url) && url.indexOf('mock:') !== 0) { toast('網址格式不正確', 'err'); return; }
    S.api = url; lsSet(LS.api, url); toast('已更新', 'ok'); boot();
  });
}

/* =====================================================================
   14. 啟動
   ===================================================================== */
async function boot() {
  if (!S.api) { S.lastHash = location.hash || '#/'; viewSetup(); return; }
  const cached = readCache();
  if (cached && !(S.session && /^#\/admin/.test(location.hash))) {
    // 上次載入過：立即顯示，背景同步
    S.data = normalize(cached.data); S.dataRole = 'public'; S.cachedAt = cached.at; S.offline = false;
    S.lastHash = '';
    route();
    syncInBackground();
    return;
  }
  $('#app').innerHTML = '<div class="boot"><div class="spin"></div>載入中…</div>';
  try {
    await loadData();
  } catch (e) {
    S.data = null;
    setChrome('');
    $('#app').innerHTML = '<div class="wrap"><div class="setup"><div class="setup-head"><h1>無法載入網站內容</h1></div><div class="setup-body"><p class="neg">' + esc(e.message) + '</p>' +
      '<div class="actions"><button class="btn" id="retry" type="button">重新連線</button><button class="btn ghost" id="toSetup" type="button">變更後端網址</button></div></div></div></div>';
    $('#retry').addEventListener('click', boot);
    $('#toSetup').addEventListener('click', () => viewSetup());
    return;
  }
  S.lastHash = '';
  route();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="#/tools"]');
  if (!a || location.hash !== '#/tools') return;
  const el = $('#tools'); if (!el) return;
  e.preventDefault(); el.scrollIntoView({ block: 'start' });
});
// 分頁放在背景超過 10 分鐘再切回來時，自動背景同步一次
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.data && S.api && Date.now() - (S.syncedAt || 0) > 600000) syncInBackground();
});
boot();

})();
</script>
