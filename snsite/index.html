<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>境外結構型商品專區</title>
<script>
/* 字型載好前先不顯示畫面，避免先用電腦內建字型、再換成網頁字型時文字跳動（最多等 1.5 秒） */
document.documentElement.classList.add('wf-wait');
setTimeout(function () { document.documentElement.classList.remove('wf-wait'); }, 1500);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* =====================================================================
   境外結構型商品專區 — single-file app
   ===================================================================== */
:root {
  --canvas: #edf0f4;
  --sheet: #ffffff;
  --tint: #f3f5f8;
  --tint-2: #f8f9fb;
  --ink: #18202b;
  --ink-2: #323a46;
  --muted: #687180;
  --rule: #d4dae2;
  --rule-2: #e5e9ef;
  --brand: #2f5d8c;
  --brand-2: #3b6d9f;
  --brand-ink: #234e7a;
  --brand-deep: #29496c;
  --brand-tint: #e7eef6;
  --brand-line: #d6e2ef;
  --brand-night: #1f3358;
  --on-brand: #ffffff;
  --on-brand-2: #d3e0ee;
  --gold: #a87b3a;
  --gold-2: #f0cd8a;
  --good: #23704a; --good-bg: #e8f4ed; --good-line: #9fd0b5;
  --mid: #9a620d; --mid-bg: #fcf3e2; --mid-line: #ecc98a;
  --bad: #ad3434; --bad-bg: #fbeceb; --bad-line: #eab3b0;
  --serif: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", Georgia, serif;
  --sans: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --wrap: 1200px;
  --gutter: 40px;
  --pad: 44px;
}
/* 區塊配色：同一套明度與飽和度，只換色相，讓三個區塊一眼分得出來又彼此相配 */
body[data-zone="qa"], #faqModal {
  --brand: #2a6a6c; --brand-2: #357b7d; --brand-ink: #1f5658; --brand-deep: #245a5c;
  --brand-tint: #e4f0ef; --brand-line: #cbe1df; --brand-night: #1b4446; --on-brand-2: #cde6e3;
}
body[data-zone="rfq"] {
  --brand: #7a5f45; --brand-2: #8a6f55; --brand-ink: #5e4630; --brand-deep: #6a5139;
  --brand-tint: #f5f0e9; --brand-line: #e6dbcc; --brand-night: #4f3c2a; --on-brand-2: #f0e5d6;
}
html.wf-wait body { opacity: 0; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--sans);
  font-size: 16.5px; line-height: 1.8; font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased;
}
body.modal-open { overflow: hidden; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; height: auto; display: block; }
b, strong { font-weight: 700; color: var(--ink); }
.neg, .neg * { color: var(--bad) !important; font-weight: 700; }
.pos, .pos * { color: var(--good) !important; font-weight: 700; }
[hidden] { display: none !important; }
button { font: inherit; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }
#app { container-type: inline-size; container-name: app; min-height: 60vh; }

/* ---------- top bar / admin bar / banner ---------- */
.topbar { background: var(--sheet); border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 60; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; gap: 20px; }
.brand { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; min-width: 0; }
.brand-mark { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--brand-ink); }
.brand-sub { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.topnav { display: flex; gap: 26px; font-size: 15px; color: var(--ink-2); align-self: stretch; }
.topnav a { display: flex; align-items: center; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.topnav a:hover { color: var(--brand); }
.topnav a.on { color: var(--brand-ink); font-weight: 600; border-bottom-color: var(--brand); }

.adminbar { background: #fff6e3; border-bottom: 1px solid var(--mid-line); font-size: 13.5px; position: sticky; top: 58px; z-index: 55; }
.adminbar .wrap { display: flex; align-items: center; gap: 6px 18px; min-height: 42px; flex-wrap: wrap; padding-top: 4px; padding-bottom: 4px; }
.adminbar .who { color: var(--mid); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.adminbar .who::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mid); }
.adminbar a, .adminbar button { background: none; border: 0; padding: 4px 0; color: var(--ink-2); cursor: pointer; }
.adminbar a:hover, .adminbar button:hover { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
.adminbar .sp { flex: 1; }
.guest-pill { position: fixed; right: 16px; bottom: 16px; z-index: 70; background: var(--mid); color: #fff; border: 0; padding: 10px 16px; cursor: pointer; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.18); }

.sync-note { position: fixed; left: 16px; bottom: 16px; z-index: 70; display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--rule); color: var(--ink-2); font-size: 12.5px; padding: 7px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.10); max-width: calc(100vw - 32px); }
.sync-note::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--mid); flex: none; }
.sync-note.busy::before { background: var(--muted); animation: syncpulse 1s ease-in-out infinite; }
@keyframes syncpulse { 50% { opacity: .25; } }
.sync-note button { background: none; border: 0; color: var(--brand); font: inherit; font-weight: 600; cursor: pointer; padding: 0 0 0 4px; }
.banner { background: var(--mid-bg); border-bottom: 1px solid var(--mid-line); color: var(--mid); font-size: 13.5px; }
.banner .wrap { padding-top: 8px; padding-bottom: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner button { background: none; border: 1px solid var(--mid-line); color: var(--mid); padding: 2px 10px; cursor: pointer; }

/* ---------- common type ---------- */
.eyebrow { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.crumbs { font-size: 14px; letter-spacing: .04em; }
.crumbs span { margin: 0 8px; opacity: .55; }
h1, h2, h3, h4 { font-weight: 600; margin: 0; color: var(--ink); }
.display { font-family: var(--serif); font-weight: 700; font-size: clamp(32px, 5vw, 54px); line-height: 1.15; }
.lead { font-size: 18px; line-height: 1.85; max-width: 46em; margin: 0; }
.arrow { display: inline-block; transition: transform .2s; }
a:hover .arrow { transform: translateX(4px); }
.muted { color: var(--muted); }

/* ---------- masthead ---------- */
.masthead, .hero { background: var(--brand); color: var(--on-brand); }
.masthead { padding: 46px 0 50px; }
.masthead .crumbs, .hero .crumbs { color: var(--on-brand-2); margin-bottom: 22px; }
.masthead .crumbs a:hover { color: #fff; text-decoration: underline; }
.masthead .display, .hero .display { color: #fff; }
.masthead .display { margin: 12px 0 18px; }
.masthead .lead, .hero .lead { color: #f2f6fb; }
.masthead .eyebrow, .hero .eyebrow { color: var(--gold-2); }
.masthead b, .masthead strong, .hero b { color: #fff; }
.masthead .neg, .masthead .neg * { color: #ffd2cc !important; }
.masthead .pos, .masthead .pos * { color: #c9f0d8 !important; }
.masthead-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 64px; align-items: end; }
.code-tag { display: inline-block; font-family: var(--mono); font-size: 14.5px; letter-spacing: .06em; color: var(--brand-ink); background: var(--gold-2); padding: 2px 10px; margin-right: 12px; font-weight: 600; }
.tagline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; }
.tag { font-size: 14px; color: var(--on-brand-2); padding: 0 12px; border-left: 1px solid rgba(255,255,255,.3); }
.tag:first-of-type { border-left: 0; padding-left: 0; }
.status-pill { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 8px; background: var(--mid-bg); color: var(--mid); border: 1px solid var(--mid-line); letter-spacing: .04em; vertical-align: middle; font-family: var(--sans); }
.masthead .status-pill { margin-left: 10px; }
.highlights { border-top: 3px solid var(--gold-2); background: rgba(255,255,255,.1); padding: 0 22px; }
.highlights h2 { font-size: 13.5px; letter-spacing: .16em; color: var(--gold-2); font-weight: 600; padding: 14px 0 2px; }
.highlights ol { list-style: none; margin: 0; padding: 0 0 6px; counter-reset: hl; }
.highlights li { counter-increment: hl; display: grid; grid-template-columns: 40px 1fr; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.18); font-size: 16.5px; color: #fff; font-weight: 500; }
.highlights li:last-child { border-bottom: 0; }
.highlights li::before { content: counter(hl, decimal-leading-zero); font-family: var(--mono); font-size: 13.5px; color: var(--gold-2); padding-top: 3px; }
.mast-edit { float: right; margin-top: -6px; }

/* ---------- document layout ---------- */
.doc { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 32px; padding: 36px var(--gutter) 80px; max-width: var(--wrap); margin: 0 auto; }
.toc { position: sticky; top: 120px; align-self: start; padding-top: 6px; }
.toc p { font-size: 13px; letter-spacing: .16em; color: var(--muted); margin: 0 0 12px; font-weight: 600; text-transform: uppercase; }
.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
.toc a { display: grid; grid-template-columns: 32px 1fr; padding: 9px 0 9px 14px; margin-left: -1px; font-size: 15.5px; line-height: 1.5; color: var(--ink-2); border-left: 2px solid transparent; cursor: pointer; }
.toc a span { font-family: var(--mono); font-size: 13px; color: var(--muted); padding-top: 2px; }
.toc a:hover { color: var(--brand); }
.toc a.on { color: var(--brand-ink); border-left-color: var(--brand); font-weight: 600; background: var(--brand-tint); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); padding: 6px var(--pad) var(--pad); min-width: 0; container: sheet / inline-size; }
/* 內容區較窄時，四張情境卡改成 2×2，避免卡片太窄、字擠成一長條 */
@container sheet (max-width: 860px) { .scen-grid[style*="--n:4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sec { padding-top: 38px; scroll-margin-top: 120px; }
.sec-head { display: flex; align-items: center; gap: 14px; margin: 0 calc(-1 * var(--pad)) 26px; padding: 13px var(--pad); background: var(--brand-tint); border-top: 1px solid var(--brand-line); border-bottom: 1px solid var(--brand-line); position: relative; }
.sec-head::before { content: ""; position: absolute; left: 0; top: -1px; bottom: -1px; width: 4px; background: var(--brand); }
.sec-no { font-family: var(--mono); font-size: 15px; color: var(--gold); font-weight: 600; }
.sec-head h2 { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--brand-ink); line-height: 1.3; }
.sec-head .en { margin-left: auto; font-size: 12.5px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }

/* rich text content */
.rt p { margin: 0 0 12px; }
.rt p:last-child { margin-bottom: 0; }
.rt h4 { font-size: 17px; font-weight: 700; color: var(--brand-ink); margin: 20px 0 8px; }
.rt h4:first-child { margin-top: 0; }
.rt ul, .rt ol { margin: 6px 0 14px; padding-left: 22px; }
.rt li { margin: 4px 0; }
.rt table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 16px; border-top: 2px solid var(--brand); }
.rt th, .rt td { padding: 9px 12px; border-bottom: 1px solid var(--rule-2); text-align: left; vertical-align: top; }
.rt th { color: var(--ink-2); font-weight: 600; width: 28%; background: var(--tint-2); }
.rt th small { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.rt thead th { width: auto; background: var(--brand-tint); color: var(--brand-ink); font-weight: 700; white-space: nowrap; }
.rt table:has(thead) tbody th { width: 20%; }
.rt td .neg, .rt td .pos { font-weight: 700; }
.rt .callout { background: var(--tint); border-left: 4px solid var(--gold); padding: 14px 18px; margin: 14px 0; line-height: 1.9; }
.rt .callout h4 { margin-top: 0; }
.rt .source { font-size: 14px; color: var(--muted); border-top: 1px solid var(--rule-2); padding-top: 8px; margin-top: 12px; }
.rt blockquote { font-family: var(--serif); font-size: 20px; line-height: 1.75; color: var(--brand-ink); font-weight: 600; margin: 0 0 10px; padding-left: 18px; border-left: 4px solid var(--gold); }
.rt .cite { font-size: 14px; color: var(--muted); margin: 0 0 18px; padding-left: 22px; }
.rt a { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
.annot { color: var(--muted); font-weight: 500; font-size: 14.5px; margin-left: 4px; border-bottom: 1px dotted var(--muted); cursor: help; }

/* term sheet */
.sheet-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14.5px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; margin-bottom: 10px; }
.sheet-head span + span { font-weight: 400; color: var(--muted); }
.termsheet { width: 100%; border-collapse: collapse; font-size: 16.5px; border-top: 2px solid var(--brand); }
.termsheet th, .termsheet td { padding: 12px 16px; border-bottom: 1px solid var(--rule-2); vertical-align: top; text-align: left; }
.termsheet th { width: 34%; font-weight: 600; color: var(--ink-2); background: var(--tint-2); font-size: 15.5px; }
.termsheet td { color: var(--ink); font-weight: 600; }
.termsheet tr:last-child th, .termsheet tr:last-child td { border-bottom-color: var(--rule); }

/* mechanics */
.mech { margin: 0; }
.mech-row { display: grid; grid-template-columns: 30% 1fr; gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--rule-2); }
.mech-row:first-child { padding-top: 2px; }
.mech-row dt { font-weight: 700; color: var(--brand-ink); font-size: 16.5px; }
.mech-row dd { margin: 0; color: var(--ink-2); }
.risk { margin-top: 28px; background: var(--bad-bg); border: 1px solid var(--bad-line); border-left: 4px solid var(--bad); padding: 18px 24px 16px; }
.risk-label { font-size: 14px; letter-spacing: .12em; color: var(--bad); font-weight: 700; margin-bottom: 6px; }
.risk ul { margin: 0; padding: 0 0 0 18px; color: var(--ink); }
.risk li { margin: 6px 0; }
.risk li::marker { color: var(--bad); }

/* scenarios */
.tone-good { --tone: var(--good); --tone-bg: var(--good-bg); --tone-line: var(--good-line); }
.tone-neutral { --tone: var(--mid); --tone-bg: var(--mid-bg); --tone-line: var(--mid-line); }
.tone-bad { --tone: var(--bad); --tone-bg: var(--bad-bg); --tone-line: var(--bad-line); }
.scen-grid { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 12px; }
.scen { appearance: none; text-align: left; cursor: pointer; color: inherit; background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--tone, var(--rule)); padding: 0; display: flex; flex-direction: column; transition: box-shadow .15s; }
.scen:hover { box-shadow: 0 4px 14px rgba(24,32,43,.09); }
.scen.on { box-shadow: 0 0 0 2px var(--tone) inset, 0 6px 18px rgba(24,32,43,.1); }
.scen-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 0; }
.scen-letter { font-family: var(--serif); font-size: 15.5px; font-weight: 700; color: var(--brand-ink); display: flex; align-items: baseline; gap: 6px; }
.scen-letter b { font-size: 30px; line-height: 1; color: var(--brand-ink); }
.scen-tag { font-size: 13px; font-weight: 700; color: var(--tone); background: var(--tone-bg); border: 1px solid var(--tone-line); padding: 1px 8px; white-space: nowrap; }
.scen-top > * { white-space: nowrap; }
.scen-title { font-size: 17.5px; font-weight: 700; color: var(--ink); line-height: 1.45; padding: 8px 16px 0; }
.scen-cond { font-size: 15px; color: var(--ink-2); line-height: 1.7; padding: 8px 16px 12px; flex: 1; }
.scen-cond p { margin: 0 0 4px; }
.scen-out { background: var(--tone-bg); border-top: 1px solid var(--tone-line); padding: 10px 16px 12px; }
.scen-out small { display: block; font-size: 12.5px; letter-spacing: .1em; color: var(--tone); font-weight: 700; margin-bottom: 2px; }
.scen-out div { font-size: 16.5px; font-weight: 700; color: var(--ink); line-height: 1.55; }
.scen-hint { font-size: 14px; color: var(--muted); margin: 10px 0 0; }

.chart-panel { margin-top: 18px; border: 1px solid var(--rule); padding: 14px 18px 6px; background: var(--sheet); }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.chart-head .eyebrow { color: var(--muted); }
.chart-now { font-size: 15.5px; font-weight: 700; color: var(--brand-ink); }
.chart-now i { font-style: normal; font-weight: 700; padding: 1px 8px; margin-left: 8px; color: var(--tone); background: var(--tone-bg); border: 1px solid var(--tone-line); font-size: 13px; }
.chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chart-wrap { position: relative; min-width: 600px; padding-bottom: 60px; }
.chart-wrap .cv { position: relative; height: 340px; }
.cf-label { position: absolute; left: 0; bottom: 44px; font-size: 12px; letter-spacing: .2em; color: var(--muted); }
.cf-row { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; pointer-events: none; }
.cf { position: absolute; bottom: 0; width: 76px; height: 36px; background: var(--tint); border-top: 2px solid var(--brand); color: var(--ink-2); font-size: 12.5px; line-height: 1.2; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 600; padding: 0 2px; }
.cf.hot { color: var(--bad); border-top-color: var(--bad); background: var(--bad-bg); }

.fig-scen { padding: 6px 0 26px; }
.fig-scen + .fig-scen { border-top: 1px solid var(--rule-2); padding-top: 26px; }
.fig-scen h3 { font-size: 18px; font-weight: 700; color: var(--ink); margin: 6px 0 8px; display: flex; gap: 10px; align-items: baseline; }
.fig-scen h3 b { font-family: var(--serif); font-size: 26px; color: var(--brand-ink); }
.fig-scen .rt { color: var(--ink-2); max-width: 52em; margin-bottom: 14px; }
figure.fig { margin: 0; background: var(--tint-2); border: 1px solid var(--rule-2); padding: 14px; max-width: 780px; }
figure.fig img { background: #fff; min-height: 40px; }
figure.fig figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
.img-err { min-height: 60px; background: var(--tint); }

/* FAQ */
.faq { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.faq-q { appearance: none; text-align: left; cursor: pointer; color: var(--ink); display: grid; grid-template-columns: 50px 1fr 20px; align-items: start; padding: 15px 16px 15px 14px; background: var(--tint-2); border: 1px solid var(--rule-2); border-left: 4px solid var(--rule); transition: background .15s, border-color .15s; }
.faq-q:hover, .faq-q:focus-visible { background: var(--sheet); border-left-color: var(--brand); outline: none; }
.q-text { font-size: 16.5px; font-weight: 600; line-height: 1.6; }
.q-no { font-family: var(--mono); font-size: 14px; color: var(--gold); padding-top: 2px; font-weight: 600; }
.q-sub { display: block; font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.faq-q .arrow { color: var(--muted); }
.faq-q:hover .arrow { color: var(--brand); transform: translateX(3px); }


/* ---------- 常見 QA ---------- */
.qa-mast { padding-bottom: 40px; }
.qa-mast .display { margin: 12px 0 14px; }
.qa-mast-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 48px; align-items: end; }
.qa-mast-tools { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.qa-search input { width: 100%; padding: 12px 14px 12px 38px; font-size: 16px; border-color: #fff; }
.qa-mast-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.light { background: #fff; color: var(--brand-ink); border-color: #fff; }
.btn.light:hover { background: var(--brand-tint); border-color: var(--brand-tint); }
.btn.light-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
.btn.light-ghost:hover { background: rgba(255,255,255,.14); border-color: #fff; }

.qa-list.compact .qa-card { display: flex; align-items: center; margin-bottom: 4px; }

/* 連到網站工具的連結：做成一整塊可點的按鈕，換行時也不會有點不到的空隙 */

.qa-fig { display: block; margin: .5em 0; }

.qa-foot { display: flex; align-items: center; gap: 10px; padding-top: .3em; flex-wrap: wrap; }

.qa-more { display: inline-block; margin-top: 16px; font-weight: 600; color: var(--brand); }

.qa-imgrow { display: flex; gap: 10px; align-items: center; padding: 6px; border: 1px solid var(--rule-2); margin-top: 6px; background: var(--tint-2); font-size: 13px; }

/* pager / footer */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 52px; }

/* ---------- home ---------- */
.hero { padding: 40px 0 40px; }

.hero-aside { border-top: 3px solid var(--gold-2); background: rgba(255,255,255,.1); padding: 0 22px; }
.hero-aside dl { margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid rgba(255,255,255,.18); }
.hero-aside dl > div { padding: 10px 0 10px 12px; border-left: 1px solid rgba(255,255,255,.18); }

.hero-aside .primer { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; font-weight: 700; color: var(--gold-2); }

/* 首頁：隱藏中的架構（僅管理員看得到） */
.prod.is-hidden { background: repeating-linear-gradient(135deg, #fbfaf6 0 12px, #f6f3ea 12px 24px); }

.hide-pill { display: inline-block; font-family: var(--sans); font-size: 13px; font-weight: 700; padding: 1px 8px; margin-left: 8px; background: #fff3d6; color: #8a5a00; border: 1px solid var(--mid-line); vertical-align: middle; letter-spacing: .02em; }
.filter button.f-hidden { border-style: dashed; color: #8a5a00; }
/* 管理後台：顯示 / 隱藏開關 */
.vis-switch { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: #fff; padding: 4px 10px 4px 5px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.vis-switch i { width: 34px; height: 18px; border-radius: 9px; background: #c8ced6; position: relative; transition: background .15s; flex: none; }
.vis-switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.vis-switch.on i { background: var(--good); }
.vis-switch.on i::after { left: 18px; }
.vis-switch.on { color: var(--good); border-color: var(--good-line); }
.vis-switch:not(.on) { color: #8a5a00; border-color: var(--mid-line); background: #fffaf0; }
.vis-sum { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-size: 14.5px; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule); padding: 12px 18px; margin-bottom: 16px; }
.vis-sum b { font-family: var(--serif); font-size: 20px; color: var(--brand-ink); margin: 0 2px; }
.vis-sum .sp { flex: 1; }
tr.row-hidden td { background: #fffbf2; }
.catalogue { padding: 30px var(--gutter) 0; max-width: var(--wrap); margin: 0 auto; }
.cat-tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.filter { display: flex; gap: 8px; flex-wrap: wrap; }
.filter button { cursor: pointer; padding: 7px 15px; font-size: 14.5px; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule); white-space: nowrap; }
.filter button:hover { border-color: var(--brand); color: var(--brand); }
.filter button.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

.search { position: relative; }

.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
.search::before { content: ""; position: absolute; left: 12px; top: 50%; width: 11px; height: 11px; border: 2px solid var(--muted); border-radius: 50%; transform: translateY(-62%); }
.search::after { content: ""; position: absolute; left: 22px; top: 58%; width: 6px; height: 2px; background: var(--muted); transform: rotate(45deg); }
.cat { background: var(--sheet); border: 1px solid var(--rule); margin-bottom: 18px; scroll-margin-top: 120px; }
.cat-head { display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 4px 0; padding: 14px 22px; background: var(--brand-tint); border-bottom: 1px solid var(--brand-line); position: relative; }
.cat-head::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px; background: var(--brand); }

.cat-head h2 { font-family: var(--serif); font-size: 21px; color: var(--brand-ink); font-weight: 700; }

.cat-admin { grid-column: 2 / -1; display: flex; gap: 14px; font-size: 13px; }
.prod { display: grid; grid-template-columns: 60px minmax(190px, 1.05fr) minmax(0, 2.2fr) 128px 24px; gap: 0 22px; align-items: start; padding: 18px 22px; border-bottom: 1px solid var(--rule-2); transition: background .15s; }

.tool-list a { padding: 18px 20px; background: var(--tint-2); border: 1px solid var(--rule-2); border-top: 3px solid var(--rule); display: flex; flex-direction: column; gap: 6px; min-height: 150px; }

.tool-list small { font-size: 12.5px; letter-spacing: .12em; color: var(--muted); }

.tool-list span { font-size: 14.5px; color: var(--ink-2); flex: 1; }

/* ---------- content pages (blocks) ---------- */
.split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.cards { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; }

.cards .ct p { margin: 0 0 6px; }
.block + .block { margin-top: 22px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { cursor: pointer; text-align: left; padding: 9px 16px; color: var(--ink-2); background: var(--tint-2); border: 1px solid var(--rule-2); }
.tabs button b { display: block; font-size: 16px; color: inherit; }

.tabpanel { margin-top: 14px; padding: 24px 26px; border: 1px solid var(--rule-2); border-top: 3px solid var(--brand); }
.tabpanel .cards { margin-top: 18px; }

/* ---------- volatility tool ---------- */
.form-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--rule); border-top: 2px solid var(--brand); }
.field { padding: 11px 16px; border-left: 1px solid var(--rule-2); background: var(--tint-2); }
.field:first-child { border-left: 0; }
.field label { display: block; font-size: 13px; letter-spacing: .1em; color: var(--muted); margin-bottom: 2px; }
.field input { width: 100%; border: 0; background: transparent; font: inherit; font-size: 18px; font-family: var(--mono); color: var(--ink); padding: 2px 0; outline: none; text-transform: uppercase; }
.field input::placeholder { color: #b5bcc6; }
.field:focus-within { background: var(--sheet); box-shadow: inset 0 -2px 0 var(--brand); }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-top: 14px; font-size: 14.5px; color: var(--ink-2); }
.opts label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--rule); }
.seg button { font-size: 14px; padding: 5px 12px; border: 0; background: var(--sheet); cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button.on { background: var(--brand); color: #fff; }
.drop { margin-top: 14px; padding: 12px 16px; border: 1px dashed var(--rule); background: var(--tint-2); font-size: 14px; color: var(--ink-2); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.status { font-size: 14px; color: var(--muted); margin-top: 10px; min-height: 1.5em; }
.data { width: 100%; border-collapse: collapse; font-size: 14px; border-top: 2px solid var(--brand); }
.data th { text-align: right; font-size: 13px; letter-spacing: .06em; color: var(--ink-2); font-weight: 700; padding: 9px 12px; background: var(--tint-2); border-bottom: 1px solid var(--rule); white-space: nowrap; }
.data td { padding: 10px 12px; border-bottom: 1px solid var(--rule-2); text-align: right; font-family: var(--mono); font-size: 15px; white-space: nowrap; }
.data th:first-child, .data td:first-child { text-align: left; }
.data td.tk { font-family: var(--sans); }
.data td.tk b { color: var(--brand-ink); font-size: 15px; }
.data td.tk small { display: block; color: var(--muted); font-size: 13px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.data td.hl { color: var(--brand-ink); font-weight: 700; background: var(--brand-tint); }
.data td.err { color: var(--bad); font-family: var(--sans); text-align: left; white-space: normal; }
.data .empty td { color: var(--muted); text-align: left; font-family: var(--sans); white-space: normal; }
.table-scroll { overflow-x: auto; }
.mini { display: block; width: 120px; height: 28px; }
.note-list { list-style: none; padding: 0; margin: 0; counter-reset: nt; font-size: 15px; color: var(--ink-2); }
.note-list li { counter-increment: nt; position: relative; padding: 9px 0 9px 34px; border-bottom: 1px solid var(--rule-2); }
.note-list li::before { content: counter(nt, decimal-leading-zero); position: absolute; left: 0; top: 11px; font-family: var(--mono); font-size: 13px; color: var(--gold); }
.note-list sub { font-size: .72em; line-height: 0; }

/* ---------- buttons / forms ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 600; cursor: pointer; padding: 9px 18px; border: 1px solid var(--brand); background: var(--brand); color: #fff; letter-spacing: .02em; white-space: nowrap; }
.btn:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn.ghost { background: var(--sheet); color: var(--brand-ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--brand); background: var(--brand-tint); }
.btn.danger { background: var(--sheet); color: var(--bad); border-color: var(--bad-line); }
.btn.danger:hover { background: var(--bad-bg); }
.btn.warn { background: var(--mid); border-color: var(--mid); color: #fff; }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; font-size: 14px; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.link-btn.danger { color: var(--bad); }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
.inp, .sel, .txt { width: 100%; font: inherit; font-size: 14.5px; padding: 8px 10px; border: 1px solid var(--rule); background: #fff; color: var(--ink); outline: none; border-radius: 0; }
.txt { min-height: 84px; resize: vertical; line-height: 1.7; }
.inp:focus, .sel:focus, .txt:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
.inp.num { font-family: var(--mono); text-align: right; padding: 6px 6px; font-size: 13.5px; }
.f { display: block; margin-bottom: 14px; }
.f > span { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.f > span em { font-style: normal; color: var(--bad); }
.f > small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.f-grid { display: grid; grid-template-columns: repeat(var(--c, 2), minmax(0, 1fr)); gap: 0 14px; }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.chk input { width: 16px; height: 16px; accent-color: var(--brand); }

/* ---------- modal dialogs ---------- */
.modal { border: 0; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: min(88vh, 940px); background: var(--sheet); color: var(--ink); box-shadow: 0 30px 80px rgba(16, 32, 56, .32); display: flex; flex-direction: column; }
.modal.wide { width: min(1100px, calc(100vw - 32px)); }
.modal.narrow { width: min(440px, calc(100vw - 32px)); }
.modal:not([open]) { display: none; }
.modal::backdrop { background: rgba(20, 38, 62, .55); }
.modal-head { background: var(--brand); color: #fff; padding: 18px 24px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; align-items: start; }
.modal-head .q-no { color: var(--gold-2); grid-column: 1; }
.modal-head h3 { grid-column: 1; font-family: var(--serif); font-size: 20px; font-weight: 700; color: #fff; line-height: 1.45; }
.modal-head .q-sub { color: var(--on-brand-2); grid-column: 1; }
.modal-head .q-sub .neg, .modal-head .q-sub .neg * { color: #ffd2cc !important; }
.modal-x { grid-column: 2; grid-row: 1 / span 3; background: none; border: 1px solid rgba(255,255,255,.45); color: #fff; width: 34px; height: 34px; font-size: 20px; line-height: 1; cursor: pointer; }
.modal-x:hover { background: rgba(255,255,255,.15); }
.modal-body { padding: 22px 24px 10px; overflow-y: auto; color: var(--ink-2); font-size: 16px; flex: 1; }
.modal-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 12px 24px; border-top: 1px solid var(--rule-2); background: var(--tint-2); }
.modal-foot .sp { flex: 1; }
.modal-foot .nav { background: none; border: 0; font-size: 14.5px; color: var(--brand-ink); cursor: pointer; padding: 4px 0; }
.modal-foot .nav:disabled { color: var(--rule); cursor: default; }
.form-err { color: var(--bad); font-size: 13.5px; min-height: 1.4em; margin: 4px 0 0; }

#toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 10px 18px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: tin .2s ease-out; max-width: 90vw; }
.toast.ok { background: var(--good); }
.toast.err { background: var(--bad); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
.busy { position: fixed; inset: 0; background: rgba(255,255,255,.7); z-index: 2500; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-weight: 600; color: var(--brand-ink); }
.spin { width: 34px; height: 34px; border: 3px solid var(--brand-tint); border-top-color: var(--brand); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.boot { padding: 120px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 16px; }

/* ---------- admin ---------- */
.adm { max-width: 1280px; margin: 0 auto; padding: 28px var(--gutter) 80px; }
.adm-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.adm-head h1 { font-family: var(--serif); font-size: 28px; color: var(--brand-ink); }
.adm-head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.adm-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--rule); margin-bottom: 22px; overflow-x: auto; overflow-y: hidden; }
.adm-tabs a { padding: 10px 16px; font-size: 14px; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.adm-tabs a:hover { color: var(--brand); }
.adm-tabs a.on { color: var(--brand-ink); font-weight: 700; border-bottom-color: var(--brand); }
.panel { background: var(--sheet); border: 1px solid var(--rule); margin-bottom: 18px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; background: var(--brand-tint); border-bottom: 1px solid var(--brand-line); flex-wrap: wrap; }
.panel-head h2 { font-size: 16px; font-weight: 700; color: var(--brand-ink); display: flex; align-items: center; gap: 10px; }
.panel-head h2 small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.panel-body { padding: 16px 18px; }
.ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.icon-btn { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; color: var(--ink-2); font-size: 14px; padding: 0; flex: none; }
.icon-btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn.del:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.atable { width: 100%; border-collapse: collapse; font-size: 14px; }
.atable th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--rule); background: var(--tint-2); white-space: nowrap; }
.atable td { padding: 10px 12px; border-bottom: 1px solid var(--rule-2); vertical-align: middle; }
.atable tr:last-child td { border-bottom: 0; }
.atable tbody tr:hover td { background: var(--tint-2); }
.atable .nm { font-weight: 700; color: var(--brand-ink); }
.atable .nm small { display: block; font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.atable .when { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.st { font-size: 12px; font-weight: 700; padding: 1px 8px; white-space: nowrap; }
.st.pub { color: var(--good); background: var(--good-bg); }
.st.draft { color: var(--mid); background: var(--mid-bg); }
.onboard { background: var(--mid-bg); border: 1px solid var(--mid-line); padding: 18px 22px; margin-bottom: 18px; }
.onboard h3 { color: var(--mid); font-size: 17px; margin-bottom: 6px; }

/* 報價表說明 */
.rfq-mast { padding-bottom: 40px; }
.rfq-mast .display { margin: 12px 0 14px; }
.rfq-mast-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 56px; align-items: end; }
.rfq-prods { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 16px; font-size: 14px; }
.rfq-prods span { color: var(--on-brand-2); margin-right: 4px; }
.rfq-prods a { padding: 2px 11px; border: 1px solid rgba(255,255,255,.45); color: #fff; font-weight: 600; }
.rfq-prods a:hover { background: rgba(255,255,255,.14); border-color: #fff; }
.rfq-dl { border-top: 3px solid var(--gold-2); background: rgba(255,255,255,.1); padding: 16px 20px 18px; }
.rfq-dl h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-2); font-weight: 700; margin: 0 0 6px; }
.rfq-dl p { margin: 0 0 12px; color: #f2f6fb; font-size: 15.5px; line-height: 1.7; }
.rfq-dl small { display: block; margin-top: 8px; color: var(--on-brand-2); font-size: 13px; word-break: break-all; }
.rfq-path { display: flex; align-items: stretch; background: rgba(0,0,0,.16); border: 1px solid rgba(255,255,255,.28); }
.rfq-path code { flex: 1; min-width: 0; padding: 8px 12px; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; color: #fff; word-break: break-all; }
.rfq-path button { border: 0; border-left: 1px solid rgba(255,255,255,.28); background: transparent; color: var(--gold-2); font-weight: 700; font-size: 13.5px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
.rfq-path button:hover { background: rgba(255,255,255,.12); color: #fff; }
.rfq-wrap { max-width: var(--wrap); margin: 0 auto; padding: 26px var(--gutter) 80px; }
.rfq-tabs { margin-bottom: 16px; }
.filter a { padding: 7px 15px; font-size: 14.5px; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule); white-space: nowrap; line-height: 1.6; }
.filter a:hover { border-color: var(--brand); color: var(--brand); }
.filter a.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.filter a.f-hidden { border-style: dashed; color: #8a5a00; }
.filter a.f-hidden.on { color: #fff; }
.rfq-hint { font-size: 14px; color: var(--muted); margin: -8px 0 12px; }
.rfq-scroll { overflow-x: auto; border: 1px solid var(--rule); -webkit-overflow-scrolling: touch; }
.rfq-tbl { border-collapse: collapse; width: 100%; font-size: 15px; }
.rfq-tbl th { background: var(--brand-night); color: #fff; font-weight: 700; font-size: 14px; line-height: 1.35; padding: 0; border-right: 1px solid rgba(255,255,255,.16); text-align: center; vertical-align: middle; }
.rfq-tbl th:last-child, .rfq-tbl td:last-child { border-right: 0; }
.rfq-tbl th button { appearance: none; display: block; width: 100%; min-height: 46px; padding: 8px 12px; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }
.rfq-tbl th button:hover { color: var(--gold-2); text-decoration: underline; text-underline-offset: 3px; }
.rfq-tbl td { padding: 9px 12px; text-align: center; white-space: nowrap; border-right: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); color: var(--ink); }
.rfq-tbl tr:last-child td { border-bottom: 0; }
.rfq-tbl th.hot { background: #8c6a35; }
.rfq-tbl td.hot { background: #fdf3dc; }
.rfq-tbl td.rfq-empty { color: var(--muted); font-size: 14px; }
.rfq-fields { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--brand); }
.rfq-f { display: grid; grid-template-columns: minmax(190px, 24%) minmax(0, 1fr); gap: 4px 28px; padding: 16px 8px 16px 4px; border-bottom: 1px solid var(--rule-2); scroll-margin-top: 130px; transition: background .25s; }
.rfq-f:hover { background: var(--tint-2); }
.rfq-f.flash { background: #fdf3dc; }
.rfq-key { display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: baseline; align-content: start; row-gap: 2px; }
.rfq-key .no { font-family: var(--mono); font-size: 13px; color: var(--gold); font-weight: 600; }
.rfq-key code { font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--brand-ink); word-break: break-word; }
.rfq-key strong { grid-column: 2; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.rfq-body { min-width: 0; }
.rfq-body .rt { line-height: 1.8; }
.rfq-nodesc { margin: 0; font-size: 14.5px; }
.rfq-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 10px; font-size: 14px; }
.rfq-meta .lb { font-size: 13px; color: var(--muted); margin-right: 2px; }
.rfq-meta .v { font-family: var(--mono); font-size: 13.5px; font-weight: 600; padding: 1px 9px; color: var(--brand-ink); background: var(--brand-tint); border: 1px solid var(--brand-line); }
.rfq-meta .ex { font-family: var(--mono); font-weight: 700; color: var(--ink); }
.rfq-meta .gap { width: 14px; }
.rfq-dir { padding-bottom: 80px; }
.rfq-peek { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.rfq-peek span { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--brand-ink); background: var(--brand-tint); border: 1px solid var(--brand-line); padding: 0 7px; line-height: 1.7; }
.rfq-peek span.more { font-family: var(--sans); font-weight: 400; color: var(--muted); background: none; border: 0; padding: 0 2px; }
.rfq-row .prod-desc:empty { display: none; }
.rfq-plinks { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 20px; }
.rfq-plinks a { display: inline-flex; align-items: center; gap: 14px; padding: 11px 16px 11px 18px; background: rgba(255,255,255,.12); border: 1px solid rgba(240,205,138,.65); border-left: 4px solid var(--gold-2); color: #fff; transition: background .15s, border-color .15s; }
.rfq-plinks a small { display: block; font-size: 12px; letter-spacing: .12em; color: var(--gold-2); font-weight: 600; line-height: 1.4; }
.rfq-plinks a b { display: block; font-size: 17px; font-weight: 700; color: #fff; line-height: 1.45; }
.rfq-plinks a .arr { font-size: 20px; color: var(--gold-2); transition: transform .15s; }
.rfq-plinks a:hover { background: rgba(255,255,255,.2); border-color: var(--gold-2); }
.rfq-plinks a:hover .arr { transform: translateX(4px); }
@container app (max-width: 760px) {
  .rfq-mast-grid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .rfq-f { grid-template-columns: minmax(0, 1fr); padding: 14px 2px; }
  .rfq-wrap { padding: 16px 0 60px; }
}
/* 報價表編輯器 */
.f > span small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.rfq-pp { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 0; border-bottom: 1px dashed var(--rule-2); }
.rfq-pp:last-child { border-bottom: 0; }
.rfq-pp > span { font-size: 12.5px; font-weight: 600; color: var(--muted); padding-top: 4px; }
.rfq-prodpick { display: flex; flex-wrap: wrap; gap: 6px; }
.rfq-prodpick label { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--rule); background: #fff; font-size: 13.5px; cursor: pointer; }
.rfq-prodpick label small { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.rfq-prodpick label:has(input:checked) { border-color: var(--brand); background: var(--brand-tint); color: var(--brand-ink); font-weight: 600; }
.rfq-dl-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin: 0 0 14px; }
.rfq-dl-opts .btn { margin-left: auto; }
.rfq-gtools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.rfq-ghint { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; line-height: 1.6; }
.rfq-grid-scroll { overflow: auto; max-height: 420px; border: 1px solid var(--rule); background: #fff; margin-bottom: 14px; }
.rfq-grid { border-collapse: separate; border-spacing: 0; font-size: 13px; }
.rfq-grid th, .rfq-grid td { padding: 0; border-right: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); }
.rfq-grid .rh { position: sticky; left: 0; z-index: 2; background: var(--tint); font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: left; padding: 0 6px; white-space: nowrap; min-width: 74px; }
.rfq-grid thead tr:first-child th { position: sticky; top: 0; z-index: 3; background: var(--tint); }
.rfq-grid thead tr:first-child th.rh { z-index: 4; }
.rfq-grid .rh button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 3px; margin-left: 4px; font-size: 12px; }
.rfq-grid .rh button:hover { color: var(--bad); }
.cg-ctl { display: flex; align-items: center; justify-content: center; gap: 1px; padding: 2px; }
.cg-ctl span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 0 3px; }
.cg-ctl button { width: 20px; height: 22px; padding: 0; border: 0; background: none; color: var(--ink-2); font-size: 13px; line-height: 1; cursor: pointer; }
.cg-ctl button:hover { background: var(--brand-tint); color: var(--brand); }
.cg-ctl button.del:hover { background: var(--bad-bg); color: var(--bad); }
.cg-ctl button:disabled { opacity: .28; cursor: default; background: none; }
.cg-in { display: block; width: 100%; min-width: 96px; padding: 7px 8px; border: 0; background: transparent; font: inherit; font-size: 13.5px; text-align: center; color: var(--ink); outline: none; }
.cg-in:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--brand); }
.rfq-grid tr.hdr td { background: var(--brand-night); }
.rfq-grid tr.hdr .cg-in { color: #fff; font-weight: 700; }
.rfq-grid tr.hdr .cg-in:focus { background: var(--brand-deep); box-shadow: inset 0 0 0 2px var(--gold-2); }
.rfq-fe { border: 1px solid var(--rule-2); background: var(--tint-2); padding: 10px 12px 0; margin-bottom: 10px; }
.rfq-fe.merged { padding-bottom: 10px; background: transparent; border-style: dashed; }
.rfq-fe-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
.rfq-fe-head .no { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--gold); }
.rfq-fe-head code { font-family: var(--mono); font-size: 14.5px; font-weight: 700; color: var(--brand-ink); }
.rfq-fe-head .chk { margin-left: auto; font-size: 13px; color: var(--ink-2); }
.rfq-fe-note { margin: 0; font-size: 13px; color: var(--muted); }
.rfq-imp-opts { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 6px; }
.rfq-imp-prev { overflow: auto; max-height: 300px; border: 1px solid var(--rule); }
.rfq-imp-prev table { border-collapse: collapse; font-size: 12.5px; }
.rfq-imp-prev td { border: 1px solid var(--rule-2); padding: 3px 8px; white-space: nowrap; }
.rfq-imp-prev tr.h td { background: var(--brand-night); color: #fff; font-weight: 700; }
.rfq-imp-prev tr.d td { background: var(--good-bg); }
.rfq-imp-prev td.rn { font-family: var(--mono); color: var(--muted); background: var(--tint) !important; font-weight: 400 !important; }

<script>
(function () {
'use strict';

/* =====================================================================
   0. 設定與狀態
   ===================================================================== */
// 發佈用 HTML 會把後端網址寫在這一行（管理後台 →「發佈 HTML」會自動產生）
const DEFAULT_API = "https://script.google.com/macros/s/AKfycbwPgm62fpZy5pxS1V_V-Xux2esqpM7xdkfZ9fWTABsuU8LHu69Amr09M9V3w7HbG7Rh/exec";
const SOURCE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const LS = { api: 'sn_api', cache: 'sn_cache_v1', session: 'sn_session_v1', img: 'sn_img_' };
const BRAND = '#2f5d8c';
const LINE_COLORS = { red: '#c0392b', green: '#23804f', orange: '#d0821f', blue: '#2f5d8c', gray: '#8a93a1', purple: '#7a4fb0' };
const COLOR_NAMES = { red: '紅', green: '綠', orange: '橙', blue: '藍', gray: '灰', purple: '紫' };
const TONES = { good: '有利', neutral: '中性', bad: '不利' };

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
const roman = n => ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV'][n] || String(n);

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) {
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) {
    // 瀏覽器儲存空間滿了：先清掉可重新下載的圖片快取，再試一次（確保網站內容快取能寫入）
    if (v == null || String(k).indexOf('sn_img_') === 0) return false;
    try {
      Object.keys(localStorage).filter(x => x.indexOf('sn_img_') === 0).forEach(x => localStorage.removeItem(x));
      localStorage.setItem(k, JSON.stringify(v)); return true;
    } catch (e2) { return false; }
  }
}

// 發佈版內建的後端網址換新時，捨棄這台電腦先前記住的舊網址
if (DEFAULT_API && lsGet('sn_api_default') !== DEFAULT_API) { try { localStorage.removeItem(LS.api); } catch (e) { /* ignore */ } lsSet('sn_api_default', DEFAULT_API); }
const S = {
  api: String(lsGet(LS.api) || DEFAULT_API || '').trim(),
  data: null, offline: false, cachedAt: 0, loadError: '',
  session: lsGet(LS.session), guest: false,
  dirty: false, lastHash: '', skipHash: false,
  imgCache: new Map(), cleanup: [], dupFrom: null
};
// 管理員登入不會自動過期（由後端判斷是否仍有效）；只有按「登出」才會清除
if (S.session && !(S.session.token && S.session.user)) { S.session = null; lsSet(LS.session, null); }
const isAdmin = () => !!S.session && !S.guest;

/* =====================================================================
   1. 後端連線
   ===================================================================== */
async function http(params, body) {
  const url = S.api;
  if (!url) throw new Error('尚未設定後端網址');
  if (url.indexOf('mock:') === 0) {
    const m = window.parent && window.parent.__SN_MOCK__;
    if (!m) throw new Error('mock backend unavailable');
    return body ? m.post(body) : m.get(params);
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), body && (body.action === 'import' || body.action === 'export' || body.action === 'migrateSnqa') ? 330000 : 60000);
  try {
    let res;
    if (body) res = await fetch(url, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal, redirect: 'follow' });
    else res = await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + new URLSearchParams(params).toString(), { signal: ctrl.signal, redirect: 'follow' });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch (e) {
      if (/<html|<!DOCTYPE/i.test(text)) throw new Error('後端回應的不是資料：請確認網址是「網頁應用程式」的部署網址（結尾 /exec），且存取權設為「所有人」。');
      throw new Error('後端回應格式錯誤');
    }
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('連線逾時，請稍後再試');
    if (e instanceof TypeError) throw new Error('無法連線到後端（請檢查網路或後端網址）');
    throw e;
  } finally { clearTimeout(timer); }
}

async function apiPost(action, payload) {
  const body = Object.assign({ action: action, token: S.session ? S.session.token : '' }, payload || {});
  const r = await http(null, body);
  if (!r || !r.ok) {
    const err = new Error((r && r.error) || '操作失敗');
    err.code = r && r.code;
    if (err.code === 'AUTH') sessionExpired();
    throw err;
  }
  return r;
}

function normalizeProduct(p) {
  ['features', 'terms', 'mechanics', 'risks', 'scenarios', 'figures', 'qaIds', 'sections'].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });
  if (!p.scenarioMode) p.scenarioMode = p.scenarios.length ? 'chart' : (p.figures.length ? 'images' : 'none');
  return p;
}
function normalize(d) {
  const out = {
    settings: Object.assign({ tools: [] }, d.settings || {}),
    settingsUpdatedAt: d.settingsUpdatedAt || '',
    categories: (d.categories || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0)),
    products: (d.products || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0)),
    qaCats: (d.qaCats || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0)),
    qaItems: (d.qaItems || []).map(q => { if (!Array.isArray(q.relatedIds)) q.relatedIds = []; return q; }),
    qaSuggest: d.qaSuggest || [],
    pages: (d.pages || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0)),

/* 圖片：讀取一次後存在記憶體與瀏覽器 */
function imageSrc(id) {
  if (!id) return Promise.reject(new Error('no image'));
  if (S.imgCache.has(id)) return S.imgCache.get(id);
  const p = (async () => {
    const meta = (S.data && S.data.images || []).find(i => i.id === id);
    const ver = meta ? (meta.updatedAt || '') : '';
    const c = lsGet(LS.img + id);
    if (c && c.src && (!meta || c.v === ver)) return c.src;
    const r = await http({ action: 'image', id: id });
    if (!r || !r.ok) throw new Error((r && r.error) || '圖片載入失敗');

/* =====================================================================
   2. HTML 安全過濾（所有可編輯內容顯示前都經過這裡）
   ===================================================================== */
const ALLOWED = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'P', 'H4', 'UL', 'OL', 'LI', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'BLOCKQUOTE', 'A', 'SPAN', 'DIV', 'SUB', 'SUP', 'SMALL']);
const DROP = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'TITLE', 'svg', 'SVG', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'IMG', 'VIDEO', 'AUDIO']);

function sanitize(html) {
  if (!html) return '';

    Array.from(parent.childNodes).forEach(node0 => {
      let node = node0;
      if (node.nodeType === 3) return;
      if (node.nodeType !== 1) { node.remove(); return; }
      let tag = node.tagName;
      if (DROP.has(tag)) { node.remove(); return; }
      if (tag === 'FONT') {
        const c = (node.getAttribute('color') || '').toLowerCase();
        const span = doc.createElement('span');
        if (/red|#c00|#f00|#ff0000|#b0|#9e|#ad/.test(c)) span.className = 'neg';
        else if (/green|#0a0|#008|#2[0-9a-f]7/.test(c)) span.className = 'pos';
        while (node.firstChild) span.appendChild(node.firstChild);
        node.replaceWith(span); node = span; tag = 'SPAN';
      }
      if (/^H[1-6]$/.test(tag) && tag !== 'H4') {
        const h = doc.createElement('h4');
        while (node.firstChild) h.appendChild(node.firstChild);
        node.replaceWith(h); node = h; tag = 'H4';
      }
      if (!ALLOWED.has(tag)) { walk(node); node.replaceWith.apply(node, Array.from(node.childNodes)); return; }
      const keep = {};
      if (tag === 'A') { const href = node.getAttribute('href') || ''; if (/^(https?:|mailto:)/i.test(href) || /^#\/[\w\-\/?=&%.]*$/.test(href)) keep.href = href; }
      if (tag === 'SPAN' && node.classList.contains('annot')) keep.title = node.getAttribute('title') || '';
      if (tag === 'TD' || tag === 'TH') ['colspan', 'rowspan'].forEach(a => { const v = node.getAttribute(a); if (v && /^\d{1,2}$/.test(v)) keep[a] = v; });
      const allowedCls = ['neg', 'pos'].concat(TAG_CLASSES[tag] || []);
      const cls = allowedCls.filter(c => node.classList.contains(c));
      Array.from(node.attributes).forEach(a => node.removeAttribute(a.name));
      Object.keys(keep).forEach(k => node.setAttribute(k, keep[k]));
      if (cls.length) node.className = cls.join(' ');
      if (tag === 'A' && !/^#\//.test(node.getAttribute('href') || '')) { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener'); }
      if (tag === 'SPAN' && !cls.length) { walk(node); node.replaceWith.apply(node, Array.from(node.childNodes)); return; }

/**
 * dialog({title, sub, body, actions:[{label, value, cls}], size, footLeft, onOpen(el), onAction(value, el)})
 * onAction 丟出錯誤 → 顯示在 .form-err 並保持開啟；回傳 false → 保持開啟。
 * Promise 的值為按下的按鈕 value（直接關閉為 null）。
 */
function dialog(opt) {
  const el = $('#dlg').open ? $('#dlg2') : $('#dlg');
  el.className = 'modal' + (opt.size ? ' ' + opt.size : '');
  const actions = opt.actions || [{ label: '確定', value: true }];
  el.innerHTML = '<div class="modal-head"><h3>' + esc(opt.title || '') + '</h3>' +
    (opt.sub ? '<span class="q-sub">' + esc(opt.sub) + '</span>' : '') +
    '<button type="button" class="modal-x" data-x aria-label="關閉">&times;</button></div>' +
    '<div class="modal-body">' + (opt.body || '') + '</div>' +
    '<div class="modal-foot">' + (opt.footLeft || '') + '<span class="sp"></span>' + actions.map((a, i) =>
      '<button type="button" class="btn ' + (a.cls || (i === actions.length - 1 ? '' : 'ghost')) + '" data-v="' + i + '">' + esc(a.label) + '</button>').join('') + '</div>';
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; if (el.open) el.close(); resolve(v); };
    el.onclick = async e => {
      if (e.target === el) {
        const r = el.getBoundingClientRect();

      }
      if (e.target.closest('[data-x]')) { finish(null); return; }
      const b = e.target.closest('.modal-foot [data-v]');
      if (!b) return;
      const val = actions[+b.dataset.v].value;
      if (opt.onAction && val !== null && val !== false) {

          const r = await opt.onAction(val, el);
          if (r === false) { btns.forEach(x => { x.disabled = false; }); return; }
        } catch (err) {
          btns.forEach(x => { x.disabled = false; });
          if (err.silent) return;
          if (fe) fe.textContent = err.message; else toast(err.message, 'err');
          return;
        }

      finish(val);
    };
    el.oncancel = e => { if (opt.sticky) e.preventDefault(); };
    el.onclose = () => { syncModalLock(); if (!done) { done = true; resolve(null); } };
    el.showModal();
    document.body.classList.add('modal-open');

    if (f) setTimeout(() => f.focus(), 30);
  });
}

function catOrder(p) { const i = S.data.categories.findIndex(c => c.id === p.categoryId); return i < 0 ? 999 : i; }
const toneOf = s => TONES[s.tone] ? s.tone : 'neutral';

function productHTML(p, opt) {
  opt = opt || {};
  const cat = S.data.categories.find(c => c.id === p.categoryId) || { name: '未分類', id: '' };
  const secs = [];
  if (p.terms.length) secs.push(['terms', '範例條件', 'Indicative Terms']);
  if (p.mechanics.length || p.risks.length) secs.push(['mech', '機制說明', 'Mechanics']);
  if ((p.scenarioMode === 'chart' && p.scenarios.length) || (p.scenarioMode === 'images' && p.figures.length)) secs.push(['scenarios', '情境分析', 'Scenarios']);
  (p.sections || []).forEach((s, i) => secs.push(['x' + i, s.title || '補充說明', s.en || '']));
  const faqs = (p.qaIds || []).map(qaById).filter(Boolean);
  if (faqs.length) secs.push(['faq', '常見 QA', 'Q&A']);
  const has = key => secs.some(s => s[0] === key);
  const head = key => { const i = secs.findIndex(s => s[0] === key); const s = secs[i]; return '<div class="sec-head"><span class="sec-no">' + pad2(i + 1) + '</span><h2>' + esc(s[1]) + '</h2><span class="en">' + esc(s[2]) + '</span></div>'; };
  const list = visibleProducts().slice().sort((a, b) => catOrder(a) - catOrder(b) || (a.order || 0) - (b.order || 0));
  const idx = list.findIndex(x => x.id === p.id);
  const prev = idx > 0 ? list[idx - 1] : null, next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;

  let html = '<section class="masthead"><div class="wrap">' +
    (isAdmin() && !opt.preview ? '<span class="mast-edit">' + visSwitch(p) + ' <a class="btn sm ghost" href="#/admin/product/' + encodeURIComponent(p.id) + '">編輯此頁</a></span>' : '') +
    '<div class="crumbs"><a href="#/">首頁</a><span>/</span><a href="#/c/' + encodeURIComponent(cat.id) + '">' + esc(cat.name) + '</a><span>/</span>' + esc(p.name || '（未命名）') + '</div>' +
    '<div class="masthead-grid"><div>' +
    '<div class="tagline">' + (p.code ? '<span class="code-tag">' + esc(p.code) + '</span>' : '') + '<span class="tag">' + esc(cat.name) + '</span>' +
      (p.underlying ? '<span class="tag">連結 ' + esc(p.underlying) + '</span>' : '') + '<span class="tag">' + (p.protected ? '保本' : '不保本') + '</span>' +
      (p.status === 'draft' ? '<span class="status-pill">隱藏中・一般使用者看不到</span>' : '') + '</div>' +
    '<h1 class="display">' + esc(p.title || p.name || '（未命名）') + '</h1>' +
    '<p class="lead">' + sanitize(p.intro) + '</p>' + (() => {
      const rq = rfqVisible().filter(x => (x.productIds || []).indexOf(p.id) >= 0);
      return rq.length ? '<div class="rfq-plinks">' + rq.map(x => '<a href="#/rfq/' + encodeURIComponent(x.id) + '"><span><small>報價表說明</small><b>' + esc(x.title) + '</b></span><span class="arr">→</span></a>').join('') + '</div>' : '';
    })() + '</div>' +
    (p.features.filter(Boolean).length ? '<aside class="highlights"><h2>產品特色</h2><ol>' + p.features.filter(Boolean).map(f => '<li><span>' + sanitize(f) + '</span></li>').join('') + '</ol></aside>' : '<div></div>') +
    '</div></div></section>';

  html += '<div class="doc"><nav class="toc" aria-label="本頁章節"><p>Contents</p><ol>' +
    secs.map((s, i) => '<li><a role="button" tabindex="0" data-goto="' + s[0] + '"><span>' + pad2(i + 1) + '</span>' + esc(s[1]) + '</a></li>').join('') + '</ol></nav><div class="sheet">';
  if (has('terms')) html += '<section class="sec" data-sec="terms">' + head('terms') +
    '<div class="sheet-head"><span>假設性範例條件</span><span>Illustrative only</span></div>' +
    '<table class="termsheet">' + p.terms.map(t => '<tr><th>' + sanitize(t.k) + '</th><td>' + sanitize(t.v) + '</td></tr>').join('') + '</table></section>';
  if (has('mech')) html += '<section class="sec" data-sec="mech">' + head('mech') +
    (p.mechanics.length ? '<dl class="mech">' + p.mechanics.map(m => '<div class="mech-row"><dt>' + sanitize(m.k) + '</dt><dd>' + sanitize(m.v) + '</dd></div>').join('') + '</dl>' : '') +
    (p.risks.length ? '<div class="risk"><div class="risk-label">注意事項</div><ul>' + p.risks.map(r => '<li>' + sanitize(r) + '</li>').join('') + '</ul></div>' : '') + '</section>';
  if (has('scenarios')) {
    html += '<section class="sec" data-sec="scenarios">' + head('scenarios');
    if (p.scenarioMode === 'chart') {
      html += '<div class="scen-grid" style="--n:' + Math.max(1, Math.min(p.scenarios.length, 4)) + '">' + p.scenarios.map((s, i) => {
        const tone = toneOf(s);
        return '<button type="button" class="scen tone-' + tone + (i === 0 ? ' on' : '') + '" data-scen="' + i + '" aria-pressed="' + (i === 0) + '">' +
          '<span class="scen-top"><span class="scen-letter"><b>' + esc(s.letter) + '</b>情境</span><span class="scen-tag">' + TONES[tone] + '</span></span>' +
          (s.title ? '<span class="scen-title">' + esc(s.title) + '</span>' : '') +
          '<span class="scen-cond">' + sanitize(s.condition) + '</span>' +
          '<span class="scen-out"><small>投資人取得</small><div>' + sanitize(s.outcome) + '</div></span></button>';
      }).join('') + '</div><p class="scen-hint">點選情境卡片，下方走勢圖與現金流會切換到該情境。</p>' +
      '<div class="chart-panel"><div class="chart-head"><span class="eyebrow">標的走勢模擬</span><span class="chart-now"></span></div>' +
      '<div class="chart-scroll"><div class="chart-wrap"><div class="cv"><canvas></canvas></div><span class="cf-label">現金流</span><div class="cf-row"></div></div></div></div>';
    } else {
      html += p.figures.map((f, i) => '<div class="fig-scen"><h3><b>' + (i + 1) + '</b>' + esc(f.title || '情境 ' + (i + 1)) + '</h3><div class="rt">' + sanitize(f.text) + '</div>' +
        (f.imageId ? '<figure class="fig"><img data-img="' + esc(f.imageId) + '" alt="' + esc(f.title || '情境示意圖') + '"></figure>' : '') + '</div>').join('');
    }
    html += '</section>';
  }
  (p.sections || []).forEach((s, i) => { html += '<section class="sec" data-sec="x' + i + '">' + head('x' + i) + blocksHTML(s.blocks || []) + '</section>'; });
  if (has('faq')) html += '<section class="sec" data-sec="faq">' + head('faq') + '<div class="faq">' + faqs.map((f, i) =>
    '<button type="button" class="faq-q" data-faq="' + i + '"><span class="q-no">Q' + pad2(i + 1) + '</span><span class="q-text">' + esc(f.question) +
    '<span class="q-sub">' + esc(qaCatName(f.categoryId)) + '</span></span><span class="arrow" aria-hidden="true">→</span></button>').join('') + '</div>' +
    (opt.preview ? '' : '<a class="qa-more" href="#/qa">前往常見 QA，查看全部 ' + S.data.qaItems.length + ' 題 <span class="arrow">→</span></a>') + '</section>';
  if (!opt.preview) html += '<nav class="pager">' +
    (prev ? '<a href="#/p/' + encodeURIComponent(prev.id) + '"><small>上一個架構</small><strong>' + esc(prev.name) + '</strong></a>' : '<a href="#/"><small>返回</small><strong>商品總覽</strong></a>') +
    (next ? '<a href="#/p/' + encodeURIComponent(next.id) + '"><small>下一個架構</small><strong>' + esc(next.name) + '</strong></a>' : '<a href="#/"><small>返回</small><strong>商品總覽</strong></a>') + '</nav>';
  return html + '</div></div>';
}

function bindToc(root) {
  const goto = a => { const el = $('[data-sec="' + a.dataset.goto + '"]', root); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  $$('[data-goto]', root).forEach(a => {
    a.addEventListener('click', () => goto(a));
    a.addEventListener('keydown', e => { if (e.key === 'Enter') goto(a); });
  });
  if ('IntersectionObserver' in window && !root.closest('.ed-preview') && !root.closest('.modal')) {
    const links = $$('.toc a', root);
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.goto === e.target.dataset.sec));
    }), { rootMargin: '-30% 0px -60% 0px' });
    $$('[data-sec]', root).forEach(s => io.observe(s));
    S.cleanup.push(() => io.disconnect());
  }
}
function mountProduct(root, p) {
  bindToc(root);
  if (p.scenarioMode === 'chart' && p.scenarios.length) {
    const panel = $('.chart-panel', root);
    const show = i => {
      $$('.scen', root).forEach(b => { const on = +b.dataset.scen === i; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      const s = p.scenarios[i], tone = toneOf(s);
      const now = $('.chart-now', panel);
      now.className = 'chart-now tone-' + tone;
      now.innerHTML = '情境 ' + esc(s.letter) + (s.title ? '：' + esc(s.title) : '') + '<i>' + TONES[tone] + '</i>';
      drawChart(panel, p, i);
    };
    $$('.scen', root).forEach(b => b.addEventListener('click', () => show(+b.dataset.scen)));
    show(0);
    S.cleanup.push(() => { if (panel._chart) panel._chart.destroy(); });
  }
  const qaIds = (p.qaIds || []).filter(id => qaById(id));
  $$('.faq-q', root).forEach(b => b.addEventListener('click', () => openQaViewer(qaIds, +b.dataset.faq, b)));
  mountBlocks(root);
}

function num(v) { if (v === '' || v == null) return null; const n = Number(String(v).replace(/,/g, '')); return isFinite(n) ? n : null; }
function drawChart(panel, p, i) {
  const c = p.chart || {}, s = p.scenarios[i];
  const labels = (c.labels || []).map(x => x == null ? '' : String(x));
  const n = labels.length;
  const fit = arr => { const a = (arr || []).slice(0, n).map(num); while (a.length < n) a.push(null); return a; };
  const cv = $('.cv', panel), cfRow = $('.cf-row', panel);
  if (panel._chart) { panel._chart.destroy(); panel._chart = null; }
  if (!window.Chart) { cfRow.innerHTML = ''; cv.innerHTML = '<p class="muted" style="padding:20px">圖表元件載入失敗（請確認網路連線）。</p>'; return; }
  if (!$('canvas', cv)) cv.innerHTML = '<canvas></canvas>';
  const ds = [{ label: c.seriesLabel || '股價', data: fit(s.path), borderColor: BRAND, backgroundColor: BRAND, borderWidth: 2.4, tension: 0.32, fill: false, pointRadius: 3.2, pointBackgroundColor: BRAND, spanGaps: false }];
  (c.lines || []).forEach(l => {
    const col = LINE_COLORS[l.color] || LINE_COLORS.gray;
    const vals = Array.isArray(l.values) && l.values.length ? fit(l.values) : Array(n).fill(num(l.value));
    ds.push({ label: l.label || '', data: vals, borderColor: col, backgroundColor: col, borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, pointHoverRadius: 0, fill: false, stepped: l.stepped ? 'before' : false });
  });
  const letter = s.letter || '';
  const position = chart => {
    cfRow.innerHTML = '';
    const xs = chart.scales && chart.scales.x;
    if (!xs) return;
    (s.cashflows || []).slice(0, n).forEach((t, k) => {
      if (!t) return;
      const d = document.createElement('div');
      d.className = 'cf' + (/股票|應計配息|承接|債券/.test(t) ? ' hot' : '');
      d.textContent = t;
      d.style.left = (xs.getPixelForValue(k) - 38) + 'px';
      cfRow.appendChild(d);
    });
  };
  const yMin = num(c.yMin), yMax = num(c.yMax);
  panel._chart = new Chart($('canvas', cv), {
    type: 'line',
    data: { labels: labels, datasets: ds },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
      layout: { padding: { left: 4, right: 42, top: 4 } },
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: { min: yMin == null ? undefined : yMin, max: yMax == null ? undefined : yMax, title: { display: !!c.yTitle, text: c.yTitle || '', color: '#687180', font: { size: 13 } }, grid: { color: '#eceff3' }, ticks: { color: '#687180', font: { size: 13 } } },
        x: { ticks: { autoSkip: false, maxRotation: 0, color: '#323a46', font: { size: 13.5 } }, grid: { color: '#eceff3' } }
      },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { boxWidth: 22, boxHeight: 1, color: '#323a46', font: { size: 13.5, family: '"Inter","Noto Sans TC",sans-serif' } } },
        tooltip: { backgroundColor: '#1f3f60', cornerRadius: 0, padding: 10 }
      }
    },
    plugins: [{
      id: 'wm',
      afterDraw: ch => {
        const x = ch.ctx; x.save();
        x.font = '700 64px "Noto Serif TC", Georgia, serif'; x.fillStyle = 'rgba(47, 93, 140, 0.07)'; x.textAlign = 'right'; x.textBaseline = 'middle';
        x.fillText(letter + ' 情境', ch.chartArea.right - 12, (ch.chartArea.top + ch.chartArea.bottom) / 2); x.restore();
      },
      afterLayout: ch => position(ch)
    }]
  });
  position(panel._chart);
}

function viewProduct(id, sec) {
  const p = S.data.products.find(x => x.id === id && (isAdmin() || x.status !== 'draft'));
  if (!p) return viewNotFound('找不到這個商品，可能已隱藏或刪除。');
  render(productHTML(p), 'home');
  bindVisSwitch($('#app'), () => viewProduct(id));
  document.title = p.name + ' · ' + (S.data.settings.siteName || '');
  mountProduct($('#app'), p);
  if (sec) jumpTo('#app [data-sec="' + sec + '"]');
}

/* 舊資料是純文字（保留換行），新資料可能含格式 */
const isRich = t => /<\/?[a-z][\s\S]*>/i.test(String(t || ''));
const richOrPlain = t => isRich(t) ? sanitize(t) : esc(t || '').replace(/\n/g, '<br>');
function blocksHTML(blocks) {
  const fig = (id, cap) => id ? '<figure class="fig"><img data-img="' + esc(id) + '" alt="' + esc(cap || '圖片') + '">' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>' : '';
  const cards = items => (items || []).length ? '<div class="cards" style="--n:' + Math.min(3, items.length) + '">' + items.map((c, i) =>
    '<div><span class="n">' + pad2(i + 1) + '</span><h3>' + esc(c.title) + '</h3><div class="ct">' + richOrPlain(c.text) + '</div></div>').join('') + '</div>' : '';
  return (blocks || []).map(b => {
    switch (b.type) {
      case 'text': return '<div class="block rt">' + sanitize(b.html) + '</div>';
      case 'textImage': return '<div class="block split"><div class="rt">' + sanitize(b.html) + '</div>' + fig(b.imageId, b.caption) + '</div>';
      case 'image': return '<div class="block">' + fig(b.imageId, b.caption) + '</div>';
      case 'cards': return '<div class="block">' + cards(b.items) + '</div>';
      case 'tabs': return '<div class="block tabs-block"><div class="tabs" role="tablist">' + (b.items || []).map((t, i) =>
        '<button type="button" role="tab" aria-selected="' + (i === 0) + '" data-tab="' + i + '">' + (t.sub ? '<small>' + esc(t.sub) + '</small>' : '') + '<b>' + esc(t.label) + '</b></button>').join('') + '</div>' +
        (b.items || []).map((t, i) => '<div class="tabpanel" role="tabpanel" data-panel="' + i + '"' + (i ? ' hidden' : '') + '>' +
          (t.imageId ? '<div class="split"><div class="rt">' + sanitize(t.html) + '</div>' + fig(t.imageId, t.caption) + '</div>' : '<div class="rt">' + sanitize(t.html) + '</div>') +
          cards(t.cards) + '</div>').join('') + '</div>';
      default: return '';
    }
  }).join('');
}
function mountBlocks(root) {
  $$('.tabs-block', root).forEach(tb => {

function mountRfq(container, src) {
  const page = container.classList && container.classList.contains('rfq-page') ? container : $('.rfq-page', container);
  if (!page) return;
  const tbl = $('.rfq-tbl', page);
  let hot = '';
  const setHot = cols => {
    if (cols === hot) return; hot = cols;
    $$('.hot', tbl).forEach(x => x.classList.remove('hot'));
    if (cols) cols.split(',').forEach(i => $$('[data-col="' + i + '"]', tbl).forEach(x => x.classList.add('hot')));
  };
  page.addEventListener('mouseover', e => {
    const f = e.target.closest('.rfq-f'); if (f) return setHot(f.dataset.cols);
    const c = e.target.closest('[data-col]'); setHot(c ? c.dataset.col : '');
  });
  page.addEventListener('mouseleave', () => setHot(''));
  page.addEventListener('click', e => {
    const go = e.target.closest('[data-rfq-go]');
    if (go) {
      const f = $('.rfq-f[data-gi="' + go.dataset.rfqGo + '"]', page); if (!f) return;
      f.scrollIntoView({ behavior: 'smooth', block: 'start' });
      f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash');
      setTimeout(() => f.classList.remove('flash'), 1600);
      return;
    }
    if (e.target.closest('[data-rfq-dl]')) return rfqDownload(src);
    if (e.target.closest('[data-rfq-copy]')) {
      const t = rfqNorm(src).download.path;
      const done = () => toast('已複製檔案位置', 'ok');
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
      else fallbackCopy(t, done);
    }
  });
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('無法自動複製，請手動選取路徑', 'err'); }
  ta.remove();
}

function rfqSheetName(t) { return (String(t || '報價表').replace(/[\\\/?*\[\]:]+/g, '-').trim() || '報價表').slice(0, 31); }
const rfqTextW = s => Array.from(String(s == null ? '' : s)).reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 2 : 1), 0);

async function rfqWorkbook(EJ, q) {
  const dl = q.download, n = q.columns.length;
  const wb = new EJ.Workbook();
  wb.creator = (S.data.settings && S.data.settings.siteName) || '';
  wb.created = new Date();
  const ws = wb.addWorksheet(rfqSheetName(q.title), { views: [{ state: 'frozen', ySplit: 1 }] });
  const NAVY = 'FF1F3358', LINE = { style: 'thin', color: { argb: 'FFBFC7D3' } };
  const border = { top: LINE, left: LINE, bottom: LINE, right: LINE };
  const sample = dl.sample ? q.rows : [];
  const total = Math.max(sample.length + 5, 10);
  ws.columns = q.columns.map((c, i) => ({ width: Math.min(36, Math.max(9, rfqTextW(c.label) + 4, ...sample.map(r => rfqTextW(r[i]) + 4))) }));
  q.columns.forEach((c, i) => {
    const cell = ws.getCell(1, i + 1);
    cell.value = c.label;
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: NAVY } };
    cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
    cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
    cell.border = border;
    if (c.name) cell.note = c.name;
  });
  ws.getRow(1).height = 32;
  for (let r = 0; r < total; r++) {
    for (let i = 0; i < n; i++) {
      const cell = ws.getCell(r + 2, i + 1);
      if (r < sample.length) { const x = rfqXlValue(sample[r][i]); cell.value = x.v; if (x.fmt) cell.numFmt = x.fmt; }
      cell.alignment = { vertical: 'middle', horizontal: 'center' };
      cell.border = border;
    }
    ws.getRow(r + 2).height = 20;
  }
  if (dl.dropdown) q.columns.forEach((c, i) => {
    const vals = rfqVals(c.values).filter(v => v.indexOf('"') < 0);
    const f = vals.join(',');
    if (!vals.length || f.length > 250) return;
    for (let r = 2; r <= 201; r++) ws.getCell(r, i + 1).dataValidation = { type: 'list', allowBlank: true, formulae: ['"' + f + '"'], showErrorMessage: true, errorStyle: 'warning', errorTitle: '不在可填值清單中', error: '可填寫：' + vals.join(' / ') };
  });
  if (dl.guide) {
    const gs = wb.addWorksheet('欄位說明', { views: [{ state: 'frozen', ySplit: 1 }] });
    gs.columns = [{ width: 16 }, { width: 20 }, { width: 24 }, { width: 72 }];
    const rows = [['欄位', '中文名稱', '可填值', '說明']].concat(rfqGuideRows(q));
    rows.forEach((r, ri) => {
      r.forEach((v, ci) => {
        const cell = gs.getCell(ri + 1, ci + 1);
        cell.value = v; cell.border = border;
        cell.alignment = { vertical: ri ? 'top' : 'middle', horizontal: ri ? 'left' : 'center', wrapText: true };
        if (!ri) { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: NAVY } }; cell.font = { bold: true, color: { argb: 'FFFFFFFF' } }; }
        else if (ci === 0) cell.font = { bold: true };
      });
    });
    gs.getRow(1).height = 24;
  }
  return wb.xlsx.writeBuffer();
}
function saveBlobAs(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();

async function rfqDownload(src) {
  const q = rfqNorm(src), name = rfqFileName(q);

  function calc() {
    const u = syncUi(), pc = u.pc, sc = u.sc, P = CALC_CCY[pc], Sd = (CALC_CCY[sc] || { d: 2 }).d, diff = !u.same && pc !== sc;
    const err = [];

    if (!(strike > 0)) err.push('請輸入履約價');
    if (!(fin > 0)) err.push('請輸入最後評價日收盤價');
    if (amt > 0 && unit > 0 && Math.abs(amt / unit - Math.round(amt / unit)) > 1e-9) err.push('投資本金需為每單位名目本金的整數倍（目前為 ' + calcFmt(amt / unit, 4) + ' 單位）');

    const units = Math.round(amt / unit);

function volTool(root) {

    if (!need.length) return out;

/* ---- 解答內容：沿用 SNQA 的格式（文字＋少量 HTML＋[IMG:…]），顯示前一律過濾 ---- */
const QA_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'SPAN', 'A', 'SMALL', 'BIG', 'BR', 'P', 'MARK', 'SUB', 'SUP', 'DIV', 'FONT', 'UL', 'OL', 'LI', 'H4', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'BLOCKQUOTE', 'HR']);
